<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>2028 통합과학 출제 도우미 Pro</title>

    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <style>        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }        .sidebar-item.active { background-color: #e0e7ff; color: #4338ca; border-right: 3px solid #4338ca; font-weight: bold; }        .scrollbar-hide::-webkit-scrollbar { display: none; }        .overlay-screen { position: fixed; inset: 0; background: #111827; display: flex; align-items: center; justify-content: center; z-index: 1000; }        .login-card { width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 1.5rem; background: #1f2937; border: 1px solid #374151; text-align: center; color: white; }        #pdf-panel { transition: width 0.3s ease-in-out, opacity 0.3s ease-in-out; overflow: hidden; }        #pdf-panel.closed { width: 0 !important; opacity: 0; padding: 0; border: none; }        #pdf-render-area canvas { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 20px; border-radius: 8px; width: 100%; height: auto; }    </style>

<script>
// 데스크탑에서 모바일 레이아웃(480px) 바깥의 회색 배경에서 마우스 휠을 돌릴 때, 
// 내부 스크롤 영역이 대신 스크롤되도록 이벤트를 위임합니다.
window.addEventListener('wheel', (e) => {
    if (!e.target.closest('.overflow-y-auto')) {
        const scrollContainers = document.querySelectorAll('.overflow-y-auto');
        // 화면에 보이는 스크롤 컨테이너 중 가장 나중에 나타나는(보통 모달이거나 메인 컨텐츠) 컨테이너를 찾습니다.
        const activeContainer = Array.from(scrollContainers).reverse().find(el => el.offsetParent !== null);
        if (activeContainer) {
            activeContainer.scrollTop += e.deltaY;
        }
    }
}, { passive: true });
</script>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

    <!-- [1. 로그인 화면] -->
    <div id="login-container" class="overlay-screen">
        <div class="login-card fade-in">
            <div class="bg-indigo-600 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">관리자 로그인</h1>
            <p class="text-gray-400 text-sm mb-8">2028 통합과학 출제 도우미</p>
            <form id="admin-login-form" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 ml-1">이메일</label>
                    <input type="email" id="admin-email" class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 outline-none text-white text-sm focus:border-indigo-500 transition-all" placeholder="admin@example.com" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 ml-1">비밀번호</label>
                    <input type="password" id="admin-pw" class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 outline-none text-white text-sm focus:border-indigo-500 transition-all" placeholder="비밀번호" required>
                </div>
                <button type="submit" id="login-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-2 transition-all active:scale-95 flex justify-center items-center gap-2">
                    <span id="btn-text">로그인</span>
                    <div id="btn-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- [2. 로딩 화면] -->
    <div id="loading-overlay" class="overlay-screen hidden">
        <div class="flex flex-col items-center gap-3 text-white text-center">
            <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="font-bold">질문 리스트 및 PDF 정보를<br>동기화하는 중입니다...</p>
        </div>
    </div>

    <!-- [3. 사이드바] -->
    <aside class="w-72 bg-white border-r border-gray-200 flex flex-col z-30 shadow-lg shrink-0">
        <div class="p-6 bg-indigo-700 text-white shadow-md">
            <h1 class="text-xl font-bold flex items-center gap-2"><i data-lucide="book-open"></i> 출제 도우미</h1>
            <p class="text-[10px] text-indigo-200 mt-1 uppercase font-bold tracking-widest">Question Helper Pro</p>
        </div>
        
        <div class="p-4 border-b border-gray-100">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-xs font-bold text-indigo-800 flex items-center gap-1"><i data-lucide="file-up" class="w-3 h-3"></i> 교재 PDF 로드</label>
                <button onclick="clearStoredPDF()" id="clear-pdf-btn" class="hidden text-[10px] text-red-500 hover:underline">저장 삭제</button>
            </div>
            <input type="file" id="pdf-upload" accept=".pdf" class="block w-full text-[10px] text-slate-500 file:mr-2 file:py-1.5 file:px-2 file:rounded-md file:border-0 file:bg-indigo-600 file:text-white cursor-pointer shadow-sm"/>
            <p id="pdf-status-msg" class="text-[9px] text-indigo-500 mt-1 hidden font-bold">✅ 브라우저 내에 저장됨</p>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide" id="sidebar-menu"></nav>

        <div class="p-4 border-t border-gray-100 bg-gray-50">
            <div class="text-[10px] text-gray-400 mb-2 truncate flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> <span id="display-email">연결됨</span></div>
            <button onclick="handleLogout()" class="w-full py-2 px-4 bg-white border border-gray-300 text-gray-600 rounded-lg text-xs hover:bg-gray-100 transition-colors shadow-sm">로그아웃</button>
        </div>
    </aside>

    <!-- [4. 메인 영역] -->
    <main class="flex-1 flex overflow-hidden relative">
        <section class="flex-1 flex flex-col border-r border-gray-200 bg-white min-w-[400px]">
            <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm z-20 h-16 shrink-0">
                <div>
                    <h2 class="text-lg font-bold text-gray-800" id="header-title">단원 선택 대기</h2>
                    <p class="text-xs text-gray-500 mt-0.5">상세 질문 목록 및 수정</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="addQuestion()" id="add-btn" class="hidden bg-indigo-600 text-white px-3 py-1.5 rounded-lg hover:bg-indigo-700 transition-all shadow-sm flex items-center gap-1.5 text-xs font-bold"><i data-lucide="plus" class="w-3 h-3"></i> 질문 추가</button>
                    <button onclick="togglePDF()" class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition-all shadow-sm flex items-center gap-1.5 text-xs font-bold border border-slate-200"><span id="pdf-toggle-icon"><i data-lucide="book-open" class="w-3 h-3"></i></span> <span id="toggle-text">교재 닫기</span></button>
                </div>
            </header>
            <div class="flex-1 overflow-y-auto p-6 bg-slate-50 scrollbar-hide" id="question-container">
                <div class="flex flex-col items-center justify-center h-full text-gray-400 opacity-60">
                    <i data-lucide="layout-list" class="w-12 h-12 mb-3"></i>
                    <p class="text-sm text-center leading-relaxed">왼쪽 사이드바에서 단원을 선택하세요.</p>
                </div>
            </div>
        </section>

        <!-- PDF 패널 -->
        <section id="pdf-panel" class="w-[50%] flex flex-col bg-gray-100 min-w-[400px] border-l border-gray-200 relative shadow-inner">
            <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm z-20 h-16 shrink-0">
                <div class="flex items-center gap-2"><span class="bg-red-100 text-red-600 p-1.5 rounded-md"><i data-lucide="file-text" class="w-4 h-4"></i></span><h2 class="text-sm font-bold text-gray-800">교재 뷰어</h2></div>
                <div id="page-controls" class="hidden flex items-center gap-2"><span class="text-xs font-bold bg-yellow-100 text-yellow-800 px-2 py-1 rounded border border-yellow-200" id="page-indicator">Page -</span></div>
            </header>
            <div class="flex-1 overflow-y-auto p-6 text-center relative bg-gray-200/50 scrollbar-hide" id="pdf-container"><div id="pdf-render-area" class="w-full max-w-3xl mx-auto"></div></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 0. 설정 및 초기화 ---
        const configAppId = 'godtonggwa_v1';
        const firebaseConfig = { apiKey: "AIzaSyDYljyALj-RbHKjndZYXcOaPzK-Q6xBjjo", authDomain: "godtonggwa.firebaseapp.com", projectId: "godtonggwa", storageBucket: "godtonggwa.firebasestorage.app", messagingSenderId: "1087434066468", appId: "1:1087434066468:web:00a75c9329543afc76e6b1" };
        const app = initializeApp(firebaseConfig);
        const appCheck = initializeAppCheck(app, {
            provider: new ReCaptchaEnterpriseProvider('6LdgWWstAAAAAJiXWFVDDXeMOHocUBgmQdA62zCR'),
            isTokenAutoRefreshEnabled: true
        }); const auth = getAuth(app); const db_fs = getFirestore(app);

        const getPublicRef = (collectionName, docId = null) => {
            const col = collection(db_fs, 'artifacts', configAppId, 'public', 'data', collectionName);
            return docId ? doc(col, docId) : col;
        };

        const CURRICULUM_STRUCTURE = {
            "0. 기초 및 첨단과학": ["기본량과 단위", "측정과 어림", "정보와 신호", "인공지능", "로봇", "과학 윤리", "감염병"],
            "1. 물질과 규칙성": ["원소의 생성", "별의 진화", "원소의 주기성", "이온 결합", "공유 결합", "지각과 생명체", "전기적 성질"],
            "2. 시스템과 상호작용": ["지구 시스템", "판 구조론", "중력장 운동", "충격량과 안전", "세포와 물질", "물질대사", "유전자"],
            "3. 변화와 다양성": ["지질 시대", "대멸종", "진화", "생물 다양성", "산화 환원", "산과 염기", "중화 반응", "에너지 출입"],
            "4. 환경과 에너지": ["생태계 평형", "대기와 해양", "지구 온난화", "핵융합", "발전과 송전", "에너지 효율"]
        };
        const UNIT_KEYS = Object.keys(CURRICULUM_STRUCTURE);

        // 상세 질문 및 PDF 매핑 초기 데이터
        const initialScienceData = {
            "0. 기초 및 첨단과학": {
                "기본량과 단위": { pdf: {s:32, e:45}, q: ["SI 기본 단위를 쓰고, 힘(N)의 차원을 유도하시오."] },
                "측정과 어림": { pdf: {s:46, e:52}, q: ["유효숫자의 사칙연산 규칙을 설명하시오."] },
                "정보와 신호": { pdf: {s:53, e:59}, q: ["아날로그 신호를 디지털로 변환하는 3단계를 서술하시오."] }
            },
            "1. 물질과 규칙성": {
                "원소의 생성": { pdf: {s:60, e:66}, q: ["빅뱅 후 헬륨 원자핵 생성 시기(3분)의 중요성을 서술하시오."] },
                "별의 진화": { pdf: {s:67, e:75}, q: ["태양 질량 별의 진화 과정을 단계별로 설명하시오."] }
            },
            "2. 시스템과 상호작용": {
                "지구 시스템": { pdf: {s:105, e:112}, q: ["지구 시스템의 에너지원 3가지를 설명하시오."] },
                "판 구조론": { pdf: {s:113, e:119}, q: ["섭입형 경계에서 나타나는 지각 변동의 특징은?"] }
            },
            "3. 변화와 다양성": {
                "지질 시대": { pdf: {s:151, e:157}, q: ["표준 화석과 시상 화석의 조건을 비교하시오."] }
            },
            "4. 환경과 에너지": {
                "생태계 평형": { pdf: {s:198, e:205}, q: ["먹이 그물의 복잡성과 생태계 평형의 관계는?"] }
            }
        };

        let scienceDB = {}; let pdfDoc = null; let currentCategory = null; let currentTopic = null; let isPdfVisible = true; let unsubscribeQList = null;

        // --- 1. 인증 및 권한 확인 (admin1.html 방식) ---
        onAuthStateChanged(auth, async (user) => {
            const loginSection = document.getElementById('login-container'), loading = document.getElementById('loading-overlay');
            if (user && user.email) {
                try {
                    const adminDoc = await getDoc(doc(db_fs, "settings", "admin"));
                    if (adminDoc.exists() && adminDoc.data().adminEmail === user.email) {
                        loginSection.classList.add('hidden'); loading.classList.remove('hidden');
                        document.getElementById('display-email').innerText = user.email;
                        startQListSync(); loadLocalPDF();
                    } else { alert("관리자 권한이 없습니다."); await signOut(auth); }
                } catch (e) { console.error("Admin check fail:", e); await signOut(auth); }
            } else { loginSection.classList.remove('hidden'); loading.classList.add('hidden'); if(unsubscribeQList) { unsubscribeQList(); unsubscribeQList = null; } }
            lucide.createIcons();
        });

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnText = document.getElementById('btn-text'), spinner = document.getElementById('btn-spinner');
            btnText.innerText = "인증 중..."; spinner.classList.remove('hidden');
            try { await signInWithEmailAndPassword(auth, document.getElementById('admin-email').value, document.getElementById('admin-pw').value); }
            catch (error) { alert("로그인 실패: 정보를 확인하세요."); btnText.innerText = "로그인"; spinner.classList.add('hidden'); }
        });

        // --- 2. 출제 도우미 데이터 동기화 ---
        const startQListSync = () => {
            const docRef = getPublicRef('questions', 'mainDB');
            unsubscribeQList = onSnapshot(docRef, (snap) => {
                scienceDB = snap.exists() ? snap.data().content : initialScienceData;
                initSidebar(); 
                document.getElementById('loading-overlay').classList.add('hidden');
                if (currentCategory && currentTopic) renderQuestions();
            }, (err) => { console.error("Sync Error:", err); });
        };

        async function saveScienceCloud() {
            if (!auth.currentUser) return;
            const docRef = getPublicRef('questions', 'mainDB');
            await setDoc(docRef, { content: scienceDB }, { merge: true });
        }

        function initSidebar() {
            const nav = document.getElementById('sidebar-menu'); nav.innerHTML = '';
            UNIT_KEYS.forEach(category => {
                const details = document.createElement('details'); details.open = true;
                const summary = document.createElement('summary'); summary.className = "px-4 py-2 text-xs font-bold text-gray-500 cursor-pointer list-none flex justify-between bg-gray-50 rounded mb-1"; summary.innerHTML = `${category} <i data-lucide="chevron-down" class="w-4 h-4"></i>`;
                const ul = document.createElement('ul'); ul.className = "pl-2 border-l-2 border-indigo-100 ml-2 mb-2";
                
                (CURRICULUM_STRUCTURE[category] || []).forEach(topic => {
                    const li = document.createElement('li');
                    li.className = `sidebar-item px-3 py-2 rounded text-sm text-gray-600 hover:bg-indigo-50 cursor-pointer transition-colors ${currentTopic === topic ? 'active' : ''}`;
                    li.innerText = topic;
                    li.onclick = () => {
                        currentCategory = category; currentTopic = topic;
                        document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
                        li.classList.add('active');
                        document.getElementById('header-title').innerText = topic;
                        document.getElementById('add-btn').classList.remove('hidden');
                        renderQuestions(); if (pdfDoc && isPdfVisible) renderPDF();
                    };
                    ul.appendChild(li);
                });
                details.appendChild(summary); details.appendChild(ul); nav.appendChild(details);
            });
            lucide.createIcons();
        }

        function renderQuestions() {
            const container = document.getElementById('question-container'); container.innerHTML = '';
            if(!scienceDB[currentCategory] || !scienceDB[currentCategory][currentTopic]) {
                container.innerHTML = '<p class="text-center text-gray-400 py-10">질문 데이터가 없습니다.</p>'; return;
            }
            scienceDB[currentCategory][currentTopic].q.forEach((q, idx) => {
                const card = document.createElement('div'); card.className = "bg-white p-5 rounded-lg shadow-sm mb-3 border border-gray-200 group hover:border-indigo-200 transition-all";
                card.innerHTML = `<div class="flex gap-3"><span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${idx+1}</span><div class="flex-1"><p class="text-gray-800 leading-relaxed" id="view-${idx}">${q}</p><textarea id="edit-${idx}" class="hidden w-full p-2 border rounded text-sm bg-indigo-50/30 h-20 outline-none">${q}</textarea><div class="hidden mt-2 flex justify-end gap-2" id="btns-${idx}"><button onclick="renderQuestions()" class="px-3 py-1 text-xs bg-gray-100 rounded">취소</button><button onclick="saveEdit(${idx})" class="px-3 py-1 text-xs bg-indigo-600 text-white rounded">저장</button></div></div><div class="flex flex-col gap-1 opacity-0 group-hover:opacity-100"><button onclick="toggleEdit(${idx})" class="p-1 text-gray-400 hover:text-blue-500"><i data-lucide="pencil" class="w-4 h-4"></i></button><button onclick="deleteQuestion(${idx})" class="p-1 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        window.addQuestion = () => { const q = prompt("질문을 입력하세요:"); if(q) { if(!scienceDB[currentCategory]) scienceDB[currentCategory] = {}; if(!scienceDB[currentCategory][currentTopic]) scienceDB[currentCategory][currentTopic] = {q:[]}; scienceDB[currentCategory][currentTopic].q.push(q); saveScienceCloud(); renderQuestions(); } };
        window.toggleEdit = (idx) => { document.getElementById(`view-${idx}`).classList.add('hidden'); document.getElementById(`edit-${idx}`).classList.remove('hidden'); document.getElementById(`btns-${idx}`).classList.remove('hidden'); };
        window.saveEdit = (idx) => { scienceDB[currentCategory][currentTopic].q[idx] = document.getElementById(`edit-${idx}`).value; saveScienceCloud(); renderQuestions(); };
        window.deleteQuestion = (idx) => { if(confirm("삭제?")) { scienceDB[currentCategory][currentTopic].q.splice(idx, 1); saveScienceCloud(); renderQuestions(); } };

        // --- 3. PDF 제어 및 IndexedDB 저장 ---
        const openIDB = () => new Promise(res => { const req = indexedDB.open("ScientificPDFStore", 1); req.onupgradeneeded = (e) => e.target.result.createObjectStore("files"); req.onsuccess = (e) => res(e.target.result); });
        const loadLocalPDF = async () => {
            try {
                const idb = await openIDB(); const req = idb.transaction("files", "readonly").objectStore("files").get("last_pdf");
                req.onsuccess = async () => { if (req.result) { const reader = new FileReader(); reader.onload = async function() { pdfDoc = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise; document.getElementById('pdf-status-msg').classList.remove('hidden'); document.getElementById('clear-pdf-btn').classList.remove('hidden'); if (currentTopic) renderPDF(); }; reader.readAsArrayBuffer(req.result); } };
            } catch (e) {}
        };
        window.clearStoredPDF = async () => { if(confirm("PDF 삭제?")) { const idb = await openIDB(); idb.transaction("files", "readwrite").objectStore("files").delete("last_pdf"); location.reload(); } };
        window.togglePDF = () => { const panel = document.getElementById('pdf-panel'); isPdfVisible = !isPdfVisible; panel.classList.toggle('closed', !isPdfVisible); if(isPdfVisible && pdfDoc && currentTopic) renderPDF(); };
        async function renderPDF() { 
            const area = document.getElementById('pdf-render-area'); area.innerHTML = ''; 
            if(!pdfDoc || !scienceDB[currentCategory] || !scienceDB[currentCategory][currentTopic] || !scienceDB[currentCategory][currentTopic].pdf) return; 
            const info = scienceDB[currentCategory][currentTopic].pdf; 
            document.getElementById('page-indicator').innerText = `p.${info.s} ~ p.${info.e}`; 
            for (let i = info.s; i <= info.e; i++) { if (i > pdfDoc.numPages) break; const canvas = document.createElement('canvas'); area.appendChild(canvas); const page = await pdfDoc.getPage(i); const viewport = page.getViewport({ scale: 1.5 }); canvas.height = viewport.height; canvas.width = viewport.width; await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise; } 
        }
        document.getElementById('pdf-upload').addEventListener('change', async function(e) {
            const file = e.target.files[0]; if(!file) return;
            const idb = await openIDB(); idb.transaction("files", "readwrite").objectStore("files").put(file, "last_pdf");
            const reader = new FileReader(); reader.onload = async function() { pdfDoc = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise; if (currentTopic) renderPDF(); };
            reader.readAsArrayBuffer(file);
        });

        window.handleLogout = () => signOut(auth);
    </script>
</body>
</html>
