<script>
// 데스크탑에서 모바일 레이아웃(480px) 바깥의 회색 배경에서 마우스 휠을 돌릴 때, 
// 내부 스크롤 영역이 대신 스크롤되도록 이벤트를 위임합니다.
window.addEventListener('wheel', (e) => {
    if (!e.target.closest('.overflow-y-auto')) {
        const scrollContainers = document.querySelectorAll('.overflow-y-auto');
        // 화면에 보이는 스크롤 컨테이너 중 가장 나중에 나타나는(보통 모달이거나 메인 컨텐츠) 컨테이너를 찾습니다.
        const activeContainer = Array.from(scrollContainers).reverse().find(el => el.offsetParent !== null);
        if (activeContainer) {
            activeContainer.scrollTop += e.deltaY;
        }
    }
}, { passive: true });

            // 배너 롤링 및 터치 제어(Swipe) 로직 추가
            if (window.homeBannerInterval) clearInterval(window.homeBannerInterval);
            const banners = document.querySelectorAll('.main-banner');
            const dots = document.querySelectorAll('.banner-dot');
            if (banners.length > 1) {
                let currentBanner = 0;
                
                const showBanner = (index) => {
                    banners[currentBanner].classList.replace('opacity-100', 'opacity-0');
                    banners[currentBanner].classList.add('pointer-events-none');
                    dots[currentBanner].classList.replace('bg-white', 'bg-white/40');
                    dots[currentBanner].classList.replace('w-3', 'w-1.5');
                    
                    currentBanner = index;
                    
                    banners[currentBanner].classList.replace('opacity-0', 'opacity-100');
                    banners[currentBanner].classList.remove('pointer-events-none');
                    dots[currentBanner].classList.replace('bg-white/40', 'bg-white');
                    dots[currentBanner].classList.replace('w-1.5', 'w-3');
                };

                const nextBanner = () => showBanner((currentBanner + 1) % banners.length);
                const prevBanner = () => showBanner((currentBanner - 1 + banners.length) % banners.length);

                window.homeBannerInterval = setInterval(nextBanner, 4000);

                // Swipe Logic
                const bannerContainer = document.getElementById('main-banner-container');
                let startX = 0;
                let endX = 0;

                bannerContainer.addEventListener('touchstart', (e) => {
                    startX = e.changedTouches[0].screenX;
                    if (window.homeBannerInterval) clearInterval(window.homeBannerInterval); // 스와이프 시 롤링 일시정지
                }, {passive: true});

                bannerContainer.addEventListener('touchend', (e) => {
                    endX = e.changedTouches[0].screenX;
                    handleSwipe();
                    window.homeBannerInterval = setInterval(nextBanner, 4000); // 롤링 재시작
                }, {passive: true});

                function handleSwipe() {
                    const threshold = 50; 
                    if (startX - endX > threshold) {
                        nextBanner();
                    } else if (endX - startX > threshold) {
                        prevBanner();
                    }
                }
            }
        }

                            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
                         </div>
                         <div onclick="manageSubscription()" class="bg-white p-4 rounded-xl border border-gray-100 flex justify-between items-center cursor-pointer hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-3"><i data-lucide="credit-card" class="w-4 h-4 text-purple-500"></i><span class="text-sm">이용권 관리</span></div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
                         </div>
                    </div>
                    
                    <!-- 마이페이지로 이동된 고객센터 섹션 -->
                    <div class="mt-8 pt-6 border-t border-gray-100">
                        <h3 class="font-bold text-gray-800 mb-3 text-sm px-1">고객센터 / 앱 이용 문의</h3>
                        <div class="grid grid-cols-2 gap-3">

                                <span class="text-xs font-bold text-[#371D1E]">카톡 문의</span>
                            </div>
                            <div class="bg-white border border-gray-200 p-4 rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow-sm active:scale-95 transition-transform" onclick="copyToClipboard('godtonggwa@gmail.com')">

        window.saveProfile = async () => {

        window.handleWithdrawal = async () => {
            if(!confirm("정말 탈퇴하시겠습니까?\n\n탈퇴 시 모든 학습 기록과 구매 내역이 삭제되며 복구할 수 없습니다.")) return;

        window.updateNav = function(activeName) {
