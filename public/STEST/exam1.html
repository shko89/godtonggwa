    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            setPersistence, browserLocalPersistence, browserSessionPersistence, sendPasswordResetEmail 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc, onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5axOHuQQ9Y5VmIqvN1AeuVyAVivQlTXs",
            authDomain: "godtonggwa.firebaseapp.com",
            projectId: "godtonggwa",
            storageBucket: "godtonggwa.firebasestorage.app",
            messagingSenderId: "1087434066468",
            appId: "1:1087434066468:web:00a75c9329543afc76e6b1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentUserData = null;
        let masterExams = []; 
        let myExamData = {};  
        let myExamResults = {}; 
        
        let latestRound = 0; 
        window.selectedExamId = null; 
        window.pendingReportId = null;

        const SECURE_FILE_MAP = {
            'exam_01': 'k8s_x9d2_exam01.pdf',
            'exam_02': 'a7d_m4a1_exam02.pdf',
            'exam_03': 'z9p_q2w3_exam03.pdf',
        };

        function getSecureFileName(docId) { return SECURE_FILE_MAP[docId] || `${docId}.pdf`; }

        const loadingEl = document.getElementById('global-loading');
        const loadingText = document.getElementById('loading-text');

        // --- 로그인 폼 제출 이벤트 로직: 로그인 성공 직후 돌아가도록 [강제 이동] 적용 ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pw = document.getElementById('login-pw').value;
            const isAutoLogin = document.getElementById('auto-login').checked;

            loadingEl.classList.remove('hidden');
            loadingText.innerText = "로그인 처리 중...";
            
            try {
                const persistenceMode = isAutoLogin ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistenceMode);
                await signInWithEmailAndPassword(auth, email, pw);
                
                // [핵심 해결] 로그인에 성공하자마자 주소를 검사하여 즉시 리다이렉트 시킵니다!
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('returnTo') === 'board_write') {
                    loadingText.innerText = "글쓰기 화면으로 돌아갑니다...";
                    window.location.href = '../Board/board.html?view=write';
                    return; 
                }
                if (urlParams.get('returnTo') === 'board') {
                    loadingText.innerText = "게시판으로 돌아갑니다...";
                    window.location.href = '../Board/board.html';
                    return; 
                }
                
                // 돌아갈 곳이 없으면 모의고사 화면 렌더링 유지
            } catch (err) { 
                alert("로그인 실패: 아이디/비밀번호를 확인해주세요."); 
                loadingEl.classList.add('hidden'); 
            }
        });

        // --- Auth 리스너: 자동 로그인 상태에서도 게시판으로 잘 넘어가도록 처리 ---
        onAuthStateChanged(auth, async (user) => {
            const authContainer = document.getElementById('auth-container');
            const appContent = document.getElementById('app-content');
            
            if (user) {
                if (user.isAnonymous) {
                    console.warn("익명 사용자는 모의고사 서비스에 접근할 수 없습니다. 로그아웃 처리합니다.");
                    await signOut(auth);
                    return;
                }

                // 이미 로그인되어 들어왔을 때 게시판으로 돌아가도록 2차 방어선
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('returnTo') === 'board_write') {
                    loadingEl.classList.remove('hidden');
                    loadingText.innerText = "글쓰기 화면으로 돌아갑니다...";
                    window.location.href = '../Board/board.html?view=write';
                    return; 
                }
                if (urlParams.get('returnTo') === 'board') {
                    loadingEl.classList.remove('hidden');
                    loadingText.innerText = "게시판으로 돌아갑니다...";
                    window.location.href = '../Board/board.html';
                    return; 
                }

                currentUser = user;
                authContainer.classList.add('hidden');
                appContent.classList.remove('hidden');
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if(userDoc.exists()) {
                    currentUserData = userDoc.data();
                    const emailId = user.email.split('@')[0];
                    document.getElementById('user-badge').innerText = emailId + "님";
                }
                await loadData();

                if (urlParams.get('view') === 'report') {
                    switchTab('report');
                }
            } else {
                currentUser = null;
                currentUserData = null;
                appContent.classList.add('hidden');
                authContainer.classList.remove('hidden');
            }
            loadingEl.classList.add('hidden');
            lucide.createIcons();
        });

        window.requestPurchase = async () => {
            if(!window.selectedExamId || !currentUser) return;
            const depositor = prompt("입금자명을 입력해주세요 (확인용):", currentUserData.name);
            if (!depositor) return; 

            loadingEl.classList.remove('hidden');
            loadingText.innerText = "승인 요청 중입니다...";
            try {
                await setDoc(doc(db, "users", currentUser.uid, "my_exams", window.selectedExamId), {
                    status: 'pending', 
                    requestedAt: new Date().toISOString(),
                    depositor: depositor,
                    title: document.getElementById('modalExamTitle').innerText,
                    score: null
                }, { merge: true });

                const botToken = "8418122948:AAGLh95SYa2Dj0HPQvFOe3zlHAAHj18b9ow";
                const chatId = "7703628247";
                const msg = `🔔 [모의고사 구매 요청]\n\n시험: ${window.selectedExamId}\n학생: ${currentUserData.name} (${currentUser.email})\n입금자: ${depositor}\n\n관리자 콘솔에서 승인해주세요!`;
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`);

                alert("입금 확인 요청이 전송되었습니다.\n선생님 확인 후 자동으로 열립니다!");
                closePaymentModal();
            } catch(e) { console.error(e); alert("요청 중 오류가 발생했습니다."); } finally { loadingEl.classList.add('hidden'); }
        };

        window.downloadExamPaper = async (docId, examTitle) => {
            if(!currentUser || !currentUserData) return alert("사용자 정보가 없습니다.");
            
            loadingEl.classList.remove('hidden');
            loadingText.innerText = "파일 확인 중...";
            
            try {
                const secureFileName = getSecureFileName(docId);
                const pdfUrl = `./exams/${secureFileName}`; 

                console.log(`[디버깅] 요청 URL: ${pdfUrl}`);

                const pdfRes = await fetch(pdfUrl);

                if (!pdfRes.ok) {
                    throw new Error(`파일을 찾을 수 없습니다.\n상태코드: ${pdfRes.status} (${pdfRes.statusText})\n\n경로: ${pdfUrl}\n\n폴더에 파일이 실제로 있는지 확인해주세요!`);
                }

                const existingPdfBytes = await pdfRes.arrayBuffer();
                
                const headerBytes = new Uint8Array(existingPdfBytes.slice(0, 5));
                const headerString = String.fromCharCode(...headerBytes);

                if (headerString !== '%PDF-') {
                    const textDec = new TextDecoder();
                    console.error("잘못된 파일 내용:", textDec.decode(existingPdfBytes));
                    throw new Error(`PDF 파일이 아닙니다!\n(헤더 감지됨: ${headerString})\n\n혹시 404 에러 페이지가 다운로드 되었는지 콘솔(F12)을 확인하세요.`);
                }

                loadingText.innerText = "워터마크 생성 중...";
                
                let customFont = null;
                let useFallback = false;
                const { PDFDocument, rgb, degrees, StandardFonts } = PDFLib;
                const pdfDoc = await PDFDocument.load(existingPdfBytes);

                try {
                    const fontUrl = `./fonts/watermark.ttf`; 
                    const fontRes = await fetch(fontUrl);
                    if (!fontRes.ok) throw new Error("폰트 파일 없음");
                    const fontBytes = await fontRes.arrayBuffer();
                    pdfDoc.registerFontkit(fontkit);
                    customFont = await pdfDoc.embedFont(fontBytes);
                } catch (fontErr) {
                    console.warn("폰트 로드 실패, 기본 폰트 사용:", fontErr);
                    useFallback = true;
                    customFont = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
                }

                const pages = pdfDoc.getPages();
                const { width, height } = pages[0].getSize();
                let watermarkText = `${currentUserData.name} / ${currentUserData.email}`;
                if (useFallback) watermarkText = `${currentUser.email}`;
                const textSize = 24;

                pages.forEach(page => {
                    page.drawText(watermarkText, {
                        x: width / 2 - 100, y: height / 2, size: textSize, font: customFont,
                        color: rgb(0.8, 0.2, 0.2), opacity: 0.2, rotate: degrees(45),
                    });
                    page.drawText(`Licensed to: ${currentUser.uid}`, {
                        x: 20, y: 20, size: 9, font: customFont, color: rgb(0.5, 0.5, 0.5),
                    });
                });

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${examTitle}_Secure.pdf`;
                
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(link.href), 1000);

            } catch (e) { 
                alert("❌ 오류 발생:\n" + e.message); 
                console.error(e);
            } finally { 
                loadingEl.classList.add('hidden'); 
            }

        async function hydrateMissingData(examId, myAnswers) {
            try {
                const examDocRef = doc(db, "exams", examId);
                const examSnap = await getDoc(examDocRef);
                
                if (!examSnap.exists()) return null;
                const examData = examSnap.data();

                let questions = [];
                if (examData.questions && Array.isArray(examData.questions)) {
                    questions = examData.questions;
                } 
                else if (examData.score_map) {
                    questions = examData.score_map.map((s, i) => ({
                        no: i + 1, score: s, correctAnswer: examData.answer_key[i], qId: null
                    }));
                }

                const promises = questions.map(async (q, i) => {
                    const studentMark = myAnswers[i];
                    const isCorrect = studentMark === q.correctAnswer;
                    let taxonomy = {};

                    if (q.qId) {
                        try {
                            const qSnap = await getDoc(doc(db, "questions", q.qId));
                            if (qSnap.exists()) {
                                taxonomy = qSnap.data().taxonomy || {};
                            }
                        } catch(e) { console.warn("Question fetch error:", e); }
                    }

                    return {
                        no: i + 1,
                        studentMark: studentMark,
                        correctAnswer: q.correctAnswer,
                        isCorrect: isCorrect,
                        score: q.score,
                        taxonomy: taxonomy
                    };
                });

                return await Promise.all(promises);
            } catch(e) {
                console.error("Hydration Failed:", e);
                return null;
            }
        }
        
        function analyzeRestoredData(answers) {
            const domainStats = {};
            const topicStats = {};

            answers.forEach(ans => {
                const tax = ans.taxonomy || {};
                const domain = tax.domain || '기타';
                const topic = tax.topic || '기타';

                if (!domainStats[domain]) domainStats[domain] = { total: 0, earned: 0 };
                domainStats[domain].total += ans.score;
                if (ans.isCorrect) domainStats[domain].earned += ans.score;

                if (!topicStats[topic]) topicStats[topic] = { count: 0, wrong: 0 };
                topicStats[topic].count++;
                if (!ans.isCorrect) topicStats[topic].wrong++;
            });

            const domainScores = {};
            for (const [key, val] of Object.entries(domainStats)) {
                domainScores[key] = val.total > 0 ? Math.round((val.earned / val.total) * 100) : 0;
            }

            const weakness = Object.entries(topicStats)
                .filter(([_, val]) => val.wrong > 0)
                .sort((a, b) => (b[1].wrong / b[1].count) - (a[1].wrong / a[1].count))
                .slice(0, 2)
                .map(([key, _]) => key);

            return { domainScores, weakness };
        }

            const labels = Object.keys(domainScores);
            const scores = Object.values(domainScores);

            if (labels.length > 0) {
                const ctx = document.getElementById('radarChart').getContext('2d');
                if(window.myRadarChart) window.myRadarChart.destroy();
                
                window.myRadarChart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '나의 점수',
                            data: scores,
                            backgroundColor: 'rgba(79, 70, 229, 0.2)',
                            borderColor: '#4F46E5',
                            pointBackgroundColor: '#4F46E5',
                            pointBorderColor: '#fff',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        scales: { r: { suggestedMin: 0, suggestedMax: 100, ticks: { display: false }, pointLabels: { font: { size: 10, family: 'Noto Sans KR' } } } },
                        plugins: { legend: { display: false } },
                        maintainAspectRatio: false
                    }
                });
            } else {
                document.getElementById('radarChart').parentElement.innerHTML = '<p class="text-center text-gray-400 text-xs py-10">데이터 부족</p>';
            }

            const weaknessList = document.getElementById('weakness-list');
            const weaknesses = data.analysis?.weakness || [];
            let wHtml = '';
            if (weaknesses.length > 0) {
                weaknesses.forEach(topic => {
                    wHtml += `<div class="bg-white p-3 rounded-xl border border-red-100 flex items-center justify-between shadow-sm">
                        <span class="text-sm font-bold text-gray-700">${topic}</span>
                        <span class="text-[10px] text-red-600 bg-red-50 px-2 py-1 rounded font-bold">Weak</span>
                    </div>`;
                });
            } else {
                wHtml = '<p class="text-center text-emerald-600 text-xs py-2 font-bold">취약점이 없습니다. 완벽합니다!</p>';
            }
            weaknessList.innerHTML = wHtml;

            const detailList = document.getElementById('detail-list');
            let answers = data.answers || [];

            if (answers.length === 0 && data.myAnswers) {
                 answers = data.myAnswers.map((mark, i) => ({
                    no: i + 1, studentMark: mark, correctAnswer: '?', isCorrect: false, score: 0, taxonomy: { topic: '-' }
                }));
            }
            
            let tableHtml = '';
            
            if (answers.length > 0) {
                answers.sort((a,b) => a.no - b.no).forEach(item => {
                    const isCorrect = item.isCorrect;
                    const resultBadge = isCorrect 
                        ? `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-100 text-emerald-600 text-[10px] font-bold"><i data-lucide="check" class="w-3 h-3"></i></span>`
                        : `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-red-100 text-red-600 text-[10px] font-bold"><i data-lucide="x" class="w-3 h-3"></i></span>`;
                    
                    const markStyle = isCorrect ? 'text-gray-600' : 'text-red-500 font-bold';
                    const topicText = item.taxonomy?.topic || item.taxonomy?.chapter || '-';
                    const chapterText = item.taxonomy?.chapter || ''; 

                    tableHtml += `
                        <div class="grid grid-cols-12 py-3 items-center text-center hover:bg-gray-50 transition-colors border-b border-gray-50 last:border-0">
                            <div class="col-span-1 font-medium text-gray-400 font-mono">${item.no}</div>
                            <div class="col-span-2 font-mono text-xs">
                                <span class="text-gray-400 mr-1">${item.correctAnswer}</span>
                                <span class="text-gray-300">|</span>
                                <span class="${markStyle} ml-1">${item.studentMark || '-'}</span>
                            </div>
                            <div class="col-span-2 flex justify-center">${resultBadge}</div>
                            <div class="col-span-5 text-left pl-2 truncate text-gray-600 font-medium" title="${chapterText} > ${topicText}">
                                ${topicText}
                            </div>
                            <div class="col-span-2 text-gray-400 font-mono">${item.score}</div>
                        </div>
                    `;
                });
                detailList.innerHTML = tableHtml;
            } else {
                detailList.innerHTML = '<p class="text-center py-4 text-gray-400 text-xs">상세 데이터가 없습니다.</p>';
            }
            
            lucide.createIcons();
        }

        window.changeReport = (examId) => {
            const contentDiv = document.getElementById('exam-content');
            if(contentDiv) {
                renderReportPage(contentDiv, examId);
            }
        };
        
        window.viewReportDetail = (examId) => {
            window.pendingReportId = examId;
            switchTab('report');
        };

        window.openPaymentModal = (id, title) => { window.selectedExamId = id; document.getElementById('modalExamTitle').innerText = title; document.getElementById('paymentModal').classList.remove('hidden'); setTimeout(()=>document.getElementById('paymentModal').children[1].classList.remove('translate-y-full'),10); };
        window.closePaymentModal = () => { document.getElementById('paymentModal').children[1].classList.add('translate-y-full'); setTimeout(()=>document.getElementById('paymentModal').classList.add('hidden'),300); };
        window.openScoreModal = (id) => { window.selectedExamId = id; document.getElementById('scoreInput').value = ''; document.getElementById('scoreModal').classList.remove('hidden'); };
        window.closeScoreModal = () => document.getElementById('scoreModal').classList.add('hidden');
        window.submitScore = async () => {
            const score = Number(document.getElementById('scoreInput').value);
            if(!window.selectedExamId || !currentUser) return;
            try { await setDoc(doc(db, "users", currentUser.uid, "my_exams", window.selectedExamId), { status: 'graded', score, gradedAt: new Date().toISOString() }, { merge: true }); alert("채점 완료!"); closeScoreModal(); switchTab('report'); } catch { alert("저장 실패"); }
        };
        window.copyToClipboard = (text) => { navigator.clipboard.writeText(text).then(() => alert('복사되었습니다.')).catch(() => alert('복사 실패')); };

        window.resetUserPassword = async () => {
            const email = prompt("가입하신 이메일 주소를 입력해주세요.\n비밀번호 재설정 링크를 보내드립니다.");
            if (!email) return;
            if (!email.includes('@')) return alert("올바른 이메일 형식이 아닙니다.");

            try {
                loadingEl.classList.remove('hidden');
                loadingText.innerText = "이메일 전송 중...";
                await sendPasswordResetEmail(auth, email);
                alert(`📧 전송 완료!\n\n${email} 로 재설정 메일을 보냈습니다.\n메일함을 확인하고 비밀번호를 변경해주세요.`);
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/user-not-found') {
                    alert("가입되지 않은 이메일입니다.");
                } else {
                    alert("메일 전송 실패: " + error.message);
                }
            } finally {
                loadingEl.classList.add('hidden');
            }
        };

        window.findUserEmail = async () => {
            const name = prompt("가입하실 때 사용한 '이름'을 입력해주세요.");
            if (!name) return;

            try {
                loadingEl.classList.remove('hidden');
                loadingText.innerText = "사용자 검색 중...";
                
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("name", "==", name));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert("해당 이름으로 가입된 계정이 없습니다.");
                } else {
                    let foundEmails = "";
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const email = data.email;
                        const [local, domain] = email.split('@');
                        const maskedLocal = local.length > 3 ? local.substring(0, 3) + "*".repeat(local.length - 3) : local;
                        foundEmails += `• ${maskedLocal}@${domain}\n`;
                    });
                    alert(`'${name}'님의 정보로 찾은 이메일입니다:\n\n${foundEmails}`);
                }
            } catch (error) {
                console.error(error);
                alert("검색 중 오류가 발생했습니다.");
            } finally {
                loadingEl.classList.add('hidden');
            }
        };

        lucide.createIcons();
    </script>
</body>
</html>
