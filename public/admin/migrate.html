<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB 마이그레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">DB 마이그레이션</h2>
        <p class="text-gray-600 mb-6 text-sm break-keep">
            기존 <code class="bg-gray-200 px-1 rounded">2028_s0_01</code> 문서를 <br>
            <code class="bg-gray-200 px-1 rounded">mock_2028_s0_01</code> 문서로 복사 후 기존 문서를 삭제합니다.<br>
            (exams 및 public_exams 컬렉션 모두 적용)
        </p>
        
        <button id="migrateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors">
            마이그레이션 실행
        </button>

        <div id="logArea" class="mt-4 text-left text-xs text-gray-500 bg-gray-50 p-4 rounded-lg h-48 overflow-y-auto font-mono hidden">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYljyALj-RbHKjndZYXcOaPzK-Q6xBjjo",
            authDomain: "godtonggwa.firebaseapp.com",
            projectId: "godtonggwa",
            storageBucket: "godtonggwa.firebasestorage.app",
            messagingSenderId: "1087434066468",
            appId: "1:1087434066468:web:00a75c9329543afc76e6b1"
        };

        const app = initializeApp(firebaseConfig);
        const appCheck = initializeAppCheck(app, {
            provider: new ReCaptchaEnterpriseProvider('6LdgWWstAAAAAJiXWFVDDXeMOHocUBgmQdA62zCR'),
            isTokenAutoRefreshEnabled: true
        });
        const auth = getAuth(app);
        const db = getFirestore(app);

        const logArea = document.getElementById('logArea');
        const migrateBtn = document.getElementById('migrateBtn');

        function log(msg) {
            logArea.classList.remove('hidden');
            logArea.innerHTML += `<div>${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        migrateBtn.addEventListener('click', async () => {
            if (!auth.currentUser) {
                alert("관리자로 로그인 후 다시 시도해주세요.");
                return;
            }
            
            migrateBtn.disabled = true;
            migrateBtn.innerText = "처리 중...";
            log("⏳ 마이그레이션 시작...");

            const oldId = "2028_s0_01";
            const newId = "mock_2028_s0_01";

            try {
                // 1. exams collection
                const oldExamRef = doc(db, "exams", oldId);
                const newExamRef = doc(db, "exams", newId);
                const oldExamSnap = await getDoc(oldExamRef);
                
                if (oldExamSnap.exists()) {
                    const data = oldExamSnap.data();
                    data.docId = newId; // 문서 내부의 docId 업데이트
                    await setDoc(newExamRef, data);
                    log(`✅ [exams] ${newId}로 데이터 복사 성공`);
                    
                    await deleteDoc(oldExamRef);
                    log(`🗑️ [exams] 기존 ${oldId} 문서 삭제 완료`);
                } else {
                    log(`⚠️ [exams] ${oldId} 문서를 찾을 수 없습니다.`);
                }

                // 2. public_exams collection
                const oldPublicRef = doc(db, "public_exams", oldId);
                const newPublicRef = doc(db, "public_exams", newId);
                const oldPublicSnap = await getDoc(oldPublicRef);
                
                if (oldPublicSnap.exists()) {
                    const data = oldPublicSnap.data();
                    await setDoc(newPublicRef, data);
                    log(`✅ [public_exams] ${newId}로 데이터 복사 성공`);
                    
                    await deleteDoc(oldPublicRef);
                    log(`🗑️ [public_exams] 기존 ${oldId} 문서 삭제 완료`);
                } else {
                    log(`⚠️ [public_exams] ${oldId} 문서를 찾을 수 없습니다.`);
                }

                log("🎉 마이그레이션이 성공적으로 완료되었습니다!");
                alert("완료되었습니다. 이제 admin.html에서 확인해보세요.");
            } catch (error) {
                console.error(error);
                log(`❌ 에러 발생: ${error.message}`);
                alert("처리 중 오류가 발생했습니다.");
            } finally {
                migrateBtn.innerText = "완료";
            }
        });
    </script>
</body>
</html>
