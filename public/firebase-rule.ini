rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // 관리자 여부 판별 함수 (복수 총괄 관리자 지원)
    function isAdmin() {
      return request.auth != null && (
        request.auth.token.email in get(/databases/$(database)/documents/settings/admin).data.adminEmails ||
        request.auth.token.email == get(/databases/$(database)/documents/settings/admin).data.adminEmail ||
        request.auth.token.email == get(/databases/$(database)/documents/settings/admin).data.adminEmail2 ||
        request.auth.token.email == "godtonggwa@gmail.com" ||
        request.auth.token.email == "hanchem92@naver.com"
      );
    }

    // 1. 모의고사 목록 (public_exams)
    // 누구나 읽을 수 있고(read), 쓰기(write)는 관리자만 허용
    match /public_exams/{document=**} {
      allow read: if true;
      allow write: if isAdmin(); 
    }

    // 2. 사용자 데이터 (users)
    // 오직 로그인한 사용자 본인 또는 총괄 관리자만 데이터를 읽고 쓸 수 있습니다.
    match /users/{userId}/{document=**} {
      allow read, write: if (request.auth != null && request.auth.uid == userId) || isAdmin();
    }

    // 3. 관리자 설정 (settings 컬렉션)
    
    // (1) 전역 설정 (현재 회차 정보 등)
    // 읽기: 누구나 가능 (수험생 화면에서 최신 회차 확인용)
    // 쓰기: 총괄 관리자만 허용
    match /settings/global {
      allow read: if true;
      allow write: if isAdmin();
    }

    // (2) 관리자 계정 정보
    // 읽기: 로그인한 사용자는 읽기 가능 (admin.html 접속 시 본인이 관리자인지 대조하기 위해 필요)
    // 쓰기: 총괄 관리자만 허용
    match /settings/admin {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
  }
}