<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DB 마이그레이션</title>
</head>
<body style="background: #111; color: #fff; padding: 50px;">
    <h1>데이터베이스 마이그레이션 도구</h1>
    <p>아래 버튼을 클릭하여 모의고사 데이터를 5등급제/기출문제 분리 기준으로 업데이트합니다.</p>
    <button id="migrate-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00ffaa; border: none; border-radius: 8px;">마이그레이션 실행</button>
    <div id="log" style="margin-top: 20px; white-space: pre-wrap; font-family: monospace;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, writeBatch, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDYljyALj-RbHKjndZYXcOaPzK-Q6xBjjo",
            authDomain: "godtonggwa.firebaseapp.com",
            projectId: "godtonggwa",
            storageBucket: "godtonggwa.firebasestorage.app",
            messagingSenderId: "1087434066468",
            appId: "1:1087434066468:web:00a75c9329543afc76e6b1"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const logEl = document.getElementById('log');
        function log(msg) {
            console.log(msg);
            logEl.textContent += msg + '\n';
        }

        document.getElementById('migrate-btn').onclick = async () => {
            log("마이그레이션 시작...");
            try {
                const batch = writeBatch(db);
                let ops = 0;

                // 1. exams 마이그레이션
                const examsSnap = await getDocs(collection(db, "exams"));
                for (let docSnap of examsSnap.docs) {
                    const data = docSnap.data();
                    if (docSnap.id === 'exam_01') {
                        data.type = 'past';
                        batch.set(doc(db, "exams", "past_예비문항"), data);
                        batch.delete(doc(db, "exams", "exam_01"));
                        log("exams: exam_01 -> past_예비문항 이동 완료 (type:past).");
                        ops += 2;
                    } else {
                        batch.update(doc(db, "exams", docSnap.id), { type: 'premium' });
                        log(`exams: ${docSnap.id} -> type:premium 추가.`);
                        ops++;
                    }
                }
                
                // 2. public_exams 마이그레이션
                const publicSnap = await getDocs(collection(db, "public_exams"));
                for (let docSnap of publicSnap.docs) {
                    const data = docSnap.data();
                    if (docSnap.id === 'exam_01') {
                        data.type = 'past';
                        batch.set(doc(db, "public_exams", "past_예비문항"), data);
                        batch.delete(doc(db, "public_exams", "exam_01"));
                        log("public_exams: exam_01 -> past_예비문항 이동 완료 (type:past).");
                        ops += 2;
                    } else {
                        batch.update(doc(db, "public_exams", docSnap.id), { type: 'premium' });
                        log(`public_exams: ${docSnap.id} -> type:premium 추가.`);
                        ops++;
                    }
                }

                // 3. questions 컬렉션의 exam_id 업데이트
                const qSnap = await getDocs(query(collection(db, "questions"), where("exam_id", "==", "exam_01")));
                qSnap.forEach(docSnap => {
                    batch.update(doc(db, "questions", docSnap.id), { exam_id: "past_예비문항" });
                    log(`questions: 질문 ${docSnap.id}의 exam_id를 past_예비문항으로 변경.`);
                    ops++;
                });

                if (ops > 0) {
                    await batch.commit();
                    log("성공적으로 커밋되었습니다!");
                } else {
                    log("변경할 내용이 없습니다.");
                }
            } catch (e) {
                log("에러 발생: " + e.message);
            }
        };
    </script>
</body>
</html>
