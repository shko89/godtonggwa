<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>갓통과 - 금속 산화환원 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nanum+Pen+Script&display=swap');
        
        body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #F3F4F6; margin: 0; }
        
        /* 앱 컨테이너: card_list.html 스타일 적용 */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #FFFFFF;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .premium-banner { background: linear-gradient(135deg, #3B82F6 0%, #4F46E5 50%, #8B5CF6 100%); }

        /* 이온 모형 비커 스타일 */
        .beaker {
            width: 125px;
            height: 125px;
            border: 4px solid #333;
            border-top: none;
            border-radius: 0 0 1.2rem 1.2rem;
            background-color: rgba(186, 230, 253, 0.4);
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            padding: 8px;
            margin: 5px auto;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.03);
            overflow: hidden;
        }
        
        .beaker::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid #bae6fd;
        }

        .shape { width: 18px; height: 18px; margin: 2px; transition: all 0.3s; display: inline-block; position: relative; z-index: 5; }
        .shape.circle { border-radius: 50%; }
        .shape.square { border-radius: 4px; }
        .shape.triangle { 
            width: 0; height: 0; 
            border-left: 9px solid transparent; 
            border-right: 9px solid transparent; 
            border-bottom: 18px solid; 
            background-color: transparent !important;
            transform: translateY(-1px);
        }
        
        .graph-wrapper { background: white; border-radius: 20px; border: 1px solid #e2e8f0; padding: 12px; height: 230px; position: relative; }
        canvas { width: 100%; height: 100%; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .hidden { display: none !important; }

        .shape-option {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 6px;
        }
        .shape-option.selected {
            border-color: #4F46E5;
            opacity: 1 !important;
            transform: scale(1.1);
            background-color: #EEF2FF;
        }

        /* 해설 모달 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 24px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .handwriting { font-family: 'Nanum Pen Script', cursive; font-size: 1.5rem; line-height: 1.2; color: #334155; }
        
        .compact-select {
            padding: 4px 6px;
            background-color: #fff;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 900;
            color: #4F46E5;
            outline: none;
            text-align: center;
            min-width: 50px;
        }

        .eqn-input {
            width: 32px;
            padding: 2px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            text-align: center;
            font-weight: 900;
            font-size: 12px;
            background-color: white;
        }
    </style>

<script>
// 데스크탑에서 모바일 레이아웃(480px) 바깥의 회색 배경에서 마우스 휠을 돌릴 때, 
// 내부 스크롤 영역이 대신 스크롤되도록 이벤트를 위임합니다.
window.addEventListener('wheel', (e) => {
    if (!e.target.closest('.overflow-y-auto')) {
        const scrollContainers = document.querySelectorAll('.overflow-y-auto');
        // 화면에 보이는 스크롤 컨테이너 중 가장 나중에 나타나는(보통 모달이거나 메인 컨텐츠) 컨테이너를 찾습니다.
        const activeContainer = Array.from(scrollContainers).reverse().find(el => el.offsetParent !== null);
        if (activeContainer) {
            activeContainer.scrollTop += e.deltaY;
        }
    }
}, { passive: true });
</script>
</head>

    <script>
        let currentMode = 'MENU';
        const SHAPES = ['circle', 'square', 'triangle'];
        const COLORS = ['#ef4444', '#3b82f6', '#10b981'];

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('model-sim').classList.add('hidden');
            document.getElementById('graph-sim').classList.add('hidden');
            
            if(mode === 'MENU') {
                document.getElementById('menu-view').classList.remove('hidden');
                document.getElementById('header-title').innerText = "산화환원 마스터";
            } else if(mode === 'MODEL') {
                document.getElementById('model-sim').classList.remove('hidden');
                document.getElementById('header-title').innerText = "입자 모형 분석";
                initModelSim();
            } else {
                document.getElementById('graph-sim').classList.remove('hidden');
                document.getElementById('header-title').innerText = (mode === 'GRAPH_TOTAL') ? "전체 이온 수 분석" : "이온별 변화 분석";
                initGraphSim();
            }
            lucide.createIcons();
            document.getElementById('content').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeModal() {
            document.getElementById('explanation-modal').style.display = 'none';
        }

        /* 입자 모형 시뮬레이션 로직 */
        let modelScenario = {};
        function initModelSim() {
            document.getElementById('model-feedback').innerText = '';
            document.getElementById('charge-x').value = '';
            document.getElementById('charge-y').value = '';
            
            let cx = Math.floor(Math.random() * 3) + 1;
            let cy = Math.floor(Math.random() * 3) + 1;
            while (cx === cy) cy = Math.floor(Math.random() * 3) + 1;

            modelScenario = { cx, cy, shapes: {} };
            let indices = [0, 1, 2].sort(() => Math.random() - 0.5);
            ['spectator', 'reactant', 'product'].forEach((role, i) => {
                modelScenario.shapes[role] = { shape: SHAPES[indices[i]], color: COLORS[indices[i]], label: role };
            });

            let k = (cx + cy <= 4) ? 2 : 1; 
            modelScenario.reactantCount = k * cy;
            modelScenario.productCount = k * cx;
            modelScenario.spectatorCount = k * cx * cy; 

            renderModelBeakers();
            renderModelSelectors();
        }

        function renderModelBeakers() {
            const draw = (id, role1, count1, role2, count2) => {
                const beaker = document.getElementById(id);
                beaker.innerHTML = '';
                let ions = [];
                for(let i=0; i<count1; i++) ions.push(modelScenario.shapes[role1]);
                if(count2 > 0) for(let i=0; i<count2; i++) ions.push(modelScenario.shapes[role2]);
                
                ions.sort(() => Math.random() - 0.5).forEach(s => {
                    const el = document.createElement('div');
                    el.className = `shape ${s.shape}`;
                    if(s.shape === 'triangle') el.style.borderBottomColor = s.color;
                    else el.style.backgroundColor = s.color;
                    beaker.appendChild(el);
                });
            };
            draw('beaker-before', 'reactant', modelScenario.reactantCount, 'spectator', modelScenario.spectatorCount);
            draw('beaker-after', 'product', modelScenario.productCount, 'spectator', modelScenario.spectatorCount);
        }

        function renderModelSelectors() {
            ['spectator-selector', 'reactant-selector', 'product-selector'].forEach(id => {
                const div = document.getElementById(id); div.innerHTML = '';
                SHAPES.forEach(shapeType => {
                    const opt = document.createElement('div');
                    opt.className = `shape-option border border-transparent opacity-30 hover:opacity-100 transition-all cursor-pointer`;
                    opt.dataset.type = shapeType;
                    const inner = document.createElement('div');
                    inner.className = `shape ${shapeType}`;
                    let color = '#ccc';
                    Object.values(modelScenario.shapes).forEach(s => { if(s.shape === shapeType) color = s.color; });
                    if(shapeType === 'triangle') inner.style.borderBottomColor = color;
                    else inner.style.backgroundColor = color;
                    opt.appendChild(inner);
                    opt.onclick = () => {
                        Array.from(div.children).forEach(c => c.classList.remove('selected', 'border-indigo-500', 'opacity-100'));
                        opt.classList.add('selected', 'border-indigo-500', 'opacity-100');
                    };
                    div.appendChild(opt);
                });
            });
        }

        function checkModelAnswer() {
            const getSel = (id) => {
                const s = document.querySelector(`#${id} .selected`);
                return s ? s.dataset.type : null;
            };
            const ux = parseInt(document.getElementById('charge-x').value);
            const uy = parseInt(document.getElementById('charge-y').value);
            const feedback = document.getElementById('model-feedback');
            if(!ux || !uy || !getSel('spectator-selector')) {
                feedback.innerText = "데이터 분석을 완료해 주세요.";
                feedback.className = "text-center text-[11px] font-black text-amber-500";
                return;
            }
            const isCorrect = (getSel('spectator-selector') === modelScenario.shapes.spectator.shape &&
                               getSel('reactant-selector') === modelScenario.shapes.reactant.shape &&
                               getSel('product-selector') === modelScenario.shapes.product.shape &&
                               ux === modelScenario.cx && uy === modelScenario.cy);
            if(isCorrect) feedback.innerHTML = "<span class='text-emerald-500'>정답입니다! 정확한 분석입니다. 👍</span>";
            else feedback.innerHTML = "<span class='text-rose-500'>오답입니다. 모형의 개수비를 다시 분석하세요.</span>";
        }

        function showModelExplanation() {
            const s = modelScenario;
            const shapeNames = { 'circle': '동그라미', 'square': '네모', 'triangle': '세모' };
            const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
            const div = gcd(s.reactantCount, s.productCount);
            let html = `
                <p><strong>1. 이온 판별</strong></p>
                <ul class="list-disc ml-5 space-y-2">
                    <li><span class="text-blue-600 font-bold">${shapeNames[s.shapes.spectator.shape]}</span>: 반응 전후 개수가 ${s.spectatorCount}개로 불변 &rarr; 구경꾼 이온(Cl<sup>-</sup>)</li>
                    <li><span class="text-red-600 font-bold">${shapeNames[s.shapes.reactant.shape]}</span>: 반응 후 사라짐 &rarr; 반응 전 이온(X<sup>a+</sup>)</li>
                    <li><span class="text-emerald-600 font-bold">${shapeNames[s.shapes.product.shape]}</span>: 반응 후 생성 &rarr; 생성된 이온(Y<sup>b+</sup>)</li>
                </ul>
                <p class="mt-4"><strong>2. 전하량 보존 법칙</strong></p>
                <p>수용액 속 양이온의 총 전하량은 보존되어야 합니다.</p>
                <p class="bg-gray-50 p-2 rounded text-center text-sm font-bold mt-1">사라진 X<sup>a+</sup> 전하 = 생성된 Y<sup>b+</sup> 전하</p>
                <p class="mt-2">개수비 (X : Y) = ${s.reactantCount} : ${s.productCount} = ${s.reactantCount/div} : ${s.productCount/div}</p>
                <p>전하량비 (a : b) = ${s.productCount/div} : ${s.reactantCount/div}</p>
                <p>따라서 <strong>a = +${s.cx}, b = +${s.cy}</strong>입니다.</p>`;
            document.getElementById('explanation-text').innerHTML = html;
            document.getElementById('explanation-modal').style.display = 'flex';
        }

        /* 그래프 시뮬레이션 로직 */
        let graphProblem = null;
        let graphCanvas, ctx;

        function initGraphSim() {
            graphCanvas = document.getElementById('reactionGraph');
            ctx = graphCanvas.getContext('2d');
            generateGraphProblem();
        }

        function generateGraphProblem() {
            document.getElementById('chargeA').value = '';
            document.getElementById('chargeB').value = '';
            document.getElementById('chargeC').value = '';
            document.getElementById('graph-feedback').innerText = '';
            const isThree = Math.random() > 0.4; 
            const charges = [1, 2, 3].sort(() => Math.random() - 0.5);
            const nA = charges[0], nB = charges[1], nC = isThree ? charges[2] : null;
            const N0 = 12; 
            const p1_y = (N0 * nA) / nB; 
            const p1_x = p1_y; 
            let points = [{x:0, y:N0}, {x:p1_x, y:p1_y}];
            if(isThree) {
                const p2_y = (p1_y * nB) / nC;
                points.push({x: p1_x + p2_y, y: p2_y});
                document.getElementById('colChargeC').classList.remove('hidden');
            } else document.getElementById('colChargeC').classList.add('hidden');
            graphProblem = { isThree, charges: [nA, nB, nC], points, N0 };
            document.getElementById('graph-desc').innerHTML = `A<sup>a+</sup> 수용액에 금속 B를 넣어 반응시킨 결과입니다. ${isThree ? '이후 금속 C를 추가로 넣었습니다.' : ''}`;
            renderGraph();
            renderEqnInputs();
            lucide.createIcons();
        }

        function renderGraph() {
            const w = graphCanvas.width = graphCanvas.parentElement.clientWidth;
            const h = graphCanvas.height = graphCanvas.parentElement.clientHeight;
            ctx.clearRect(0,0,w,h);
            const padding = 45;
            const maxXVal = Math.max(...graphProblem.points.map(p => p.x));
            const maxYVal = Math.max(graphProblem.N0, ...graphProblem.points.map(p => p.y));
            const maxX = maxXVal * 1.25;
            const maxY = maxYVal * 1.25;
            const mapX = (v) => padding + v * (w - padding * 2) / maxX;
            const mapY = (v) => h - padding - v * (h - padding * 2) / maxY;
            ctx.beginPath(); ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5;
            ctx.moveTo(padding, 20); ctx.lineTo(padding, h-padding); ctx.lineTo(w-20, h-padding); ctx.stroke();
            const yTicks = [...new Set([graphProblem.N0, ...graphProblem.points.map(p => p.y)])].sort((a,b) => a-b);
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            yTicks.forEach(val => {
                if(val < 0.1) return;
                const y = mapY(val);
                ctx.beginPath(); ctx.moveTo(padding-4, y); ctx.lineTo(padding, y); ctx.stroke();
                ctx.fillStyle = '#64748b'; ctx.font = 'bold 9px Noto Sans KR';
                ctx.fillText(Math.round(val*10)/10 + 'N', padding - 8, y);
            });
            if(currentMode === 'GRAPH_TOTAL') {
                ctx.beginPath(); ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 3; ctx.moveTo(mapX(0), mapY(graphProblem.N0));
                graphProblem.points.forEach(p => ctx.lineTo(mapX(p.x), mapY(p.y))); ctx.stroke();
            } else {
                const pts = graphProblem.points;
                drawLine(mapX(0), mapY(graphProblem.N0), mapX(pts[1].x), mapY(0), '#ef4444');
                drawLine(mapX(0), mapY(0), mapX(pts[1].x), mapY(pts[1].y), '#3b82f6');
                if(graphProblem.isThree) {
                    drawLine(mapX(pts[1].x), mapY(pts[1].y), mapX(pts[2].x), mapY(0), '#3b82f6');
                    drawLine(mapX(pts[1].x), mapY(0), mapX(pts[2].x), mapY(pts[2].y), '#10b981');
                }
            }
        }

        function drawLine(x1, y1, x2, y2, color) { ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

        function renderEqnInputs() {
            const container = document.getElementById('eqnContainer');
            const p = graphProblem;
            container.innerHTML = `<div class="flex items-center justify-center gap-1 text-[11px] font-black"><input type="number" id="c1_a" class="eqn-input">A<sup>a+</sup> + <input type="number" id="c1_b" class="eqn-input">B &rarr; <input type="number" id="c1_a_p" class="eqn-input">A + <input type="number" id="c1_b_p" class="eqn-input">B<sup>b+</sup></div>`;
        }

        function checkGraphAnswer() {
            const na = parseInt(document.getElementById('chargeA').value);
            const nb = parseInt(document.getElementById('chargeB').value);
            const p = graphProblem;
            if(na === p.charges[0] && nb === p.charges[1]) document.getElementById('graph-feedback').innerHTML = "<span class='text-emerald-500'>정답입니다! 🎯</span>";
            else document.getElementById('graph-feedback').innerHTML = "<span class='text-rose-500'>다시 분석해 보세요.</span>";
        }

        function showGraphExplanation() {
            const p = graphProblem;
            let html = `<p><strong>분석 해설</strong></p><p>반응 전하량 보존에 의해 a= +${p.charges[0]}, b= +${p.charges[1]} 입니다.</p>`;
            document.getElementById('explanation-text').innerHTML = html;
            document.getElementById('explanation-modal').style.display = 'flex';
        }

        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
