    <script>
    function renderAllMath(target) {
        if (typeof renderMathInElement === 'function') {
            try {
                renderMathInElement(target || document.body, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false
                });
            } catch(e) {
                console.warn('KaTeX render error:', e);
            }
        }
    }
    window.MathJax = {
        typesetPromise: function(elements) {
            try {
                if (elements && Array.isArray(elements)) {
                    elements.forEach(el => el && renderAllMath(el));
                } else if (elements) {
                    renderAllMath(elements);
                } else {
                    renderAllMath(document.body);
                }
            } catch(e) { console.warn('Math render error:', e); }
            return Promise.resolve();
        }
    };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { normalizeExamId, loadExamDataScript, getEstimatedAccuracyRate } from "./exam_core.js";

        window.handleExplanationBack = function() {
            if (window.opener && !window.opener.closed) {
                window.close();
                setTimeout(fallback, 100);
                return;
            }
            fallback();

            function fallback() {
                const params = new URLSearchParams(window.location.search);
                const examId = params.get('id');
                if (document.referrer && document.referrer.includes('exam.html')) {
                    window.location.href = document.referrer;
                } else if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = examId ? `exam.html?tab=report&id=${examId}` : 'exam.html?tab=report';
                }
            }
        };

        import { firebaseConfig } from "/firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const appCheck = initializeAppCheck(app, {
            provider: new ReCaptchaEnterpriseProvider('6LdgWWstAAAAAJiXWFVDDXeMOHocUBgmQdA62zCR'),
            isTokenAutoRefreshEnabled: true
        });
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const EXAM_ID = urlParams.get('id') || 'mock_2028_s0_01';
        
        let examMetaData = null;
        let aiExamData = null;

       async function init() {
            try {
                const cleanExamId = normalizeExamId(EXAM_ID);

                const [metaSnap, loadedAiData] = await Promise.allSettled([
                    getDoc(doc(db, "exams", cleanExamId)),
                    loadExamDataScript(cleanExamId)
                ]);

                if (metaSnap.status === 'fulfilled' && metaSnap.value.exists()) {
                    examMetaData = metaSnap.value.data();
                    document.getElementById('exam-title-header').innerText = examMetaData.title || "나만의 오답노트";
                } else {
                    document.getElementById('exam-title-header').innerText = (loadedAiData.status === 'fulfilled' && loadedAiData.value && loadedAiData.value.title) ? loadedAiData.value.title : "나만의 오답노트";
                }
                if (loadedAiData.status === 'fulfilled' && loadedAiData.value) aiExamData = loadedAiData.value;
                renderQuestionGrid();
                
                // [신규 추가] URL에 qNum 또는 qId가 있으면 해당 문항 해설을 자동으로 띄우기 (undefined 방어)
                let targetQNum = null;
                const preSelectNum = urlParams.get('qNum');
                const preSelectQId = urlParams.get('qId');

                if (preSelectNum && preSelectNum !== 'undefined') {
                    const parsed = parseInt(preSelectNum, 10);
                    if (!isNaN(parsed) && parsed > 0) targetQNum = parsed;
                } else if (preSelectQId && preSelectQId !== 'undefined') {
                    const match = String(preSelectQId).match(/\d+$/);
                    if (match) {
                        const parsed = parseInt(match[0], 10);
                        if (!isNaN(parsed) && parsed > 0) targetQNum = parsed;
                    }
                }

                if (targetQNum) {
                    const btns = document.querySelectorAll('#question-grid button');
                    if (targetQNum > 0 && targetQNum <= btns.length) {
                        btns[targetQNum - 1].click();
                    }
                }

                lucide.createIcons();
            } catch (e) { console.error("초기화 오류:", e); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                init();
            } else {
                const modal = document.getElementById('auth-modal');
                modal.classList.remove('hidden');
                document.getElementById('go-login').onclick = () => {
                    const target = 'exam.html';
                    if (target) window.location.assign(target);
                };
            }
        });

        function renderQuestionGrid() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';
            
            const normId = normalizeExamId(EXAM_ID);
            let totalQ = 25;
            if (normId.startsWith('week')) {
                totalQ = 20;
            } else {
                totalQ = examMetaData?.questions?.length || (aiExamData?.answers?.length) || 25;
            }

            for (let i = 1; i <= totalQ; i++) {
                const btn = document.createElement('button');
                btn.className = "w-full aspect-square rounded-xl bg-gray-100 border-2 border-gray-200 text-[16.5px] font-bold text-gray-500 hover:bg-indigo-100 hover:border-indigo-300 hover:text-indigo-600 transition-all flex items-center justify-center shadow-sm";
                btn.innerText = i;
                btn.onclick = () => selectQuestion(i, btn);
                grid.appendChild(btn);
            }
        }

        window.selectQuestion = async (no, btnElement) => {
            document.querySelectorAll('#question-grid button').forEach(b => b.classList.remove('btn-selected'));
            btnElement.classList.add('btn-selected');

            const normId = normalizeExamId(EXAM_ID);
            const padNo = String(no).padStart(2, '0');
            const fallbackQId = `${normId}_q${padNo}`;
            const dbQ = examMetaData?.questions ? examMetaData.questions[no-1] : { score: 0, correctAnswer: '-', topic: '', qId: fallbackQId };
            const aiQ = aiExamData?.explanations ? aiExamData.explanations.find(e => e.no === no) : null;
            
            // [핵심 수정] AI 해설 파일의 토픽을 최우선으로 사용하도록 순서 변경
            const topic = aiQ?.topic || dbQ?.topic || "통합과학";
            const content = aiQ?.content || "앗! 아직 이 문항의 비밀노트 해설이 준비되지 않았어요.";

            const finalScore = (aiExamData && aiExamData.scores && aiExamData.scores.length >= no) ? aiExamData.scores[no-1] : (dbQ?.score || 2.0);
            const finalAns = (aiExamData && aiExamData.answers && aiExamData.answers.length >= no) ? aiExamData.answers[no-1] : (dbQ?.correctAnswer || '-');

            const noteArea = document.getElementById('note-content-area');
            const qNumTitle = document.getElementById('note-q-number');
            
            noteArea.style.opacity = 0;

            let statsHtml = '';
            const user = auth.currentUser;
            
            let qData = null;
            let wData = null;

            const targetQId = dbQ?.qId || fallbackQId;
            if (targetQId) {
                try {
                    const [qSnap, wrongSnap] = await Promise.all([
                        getDoc(doc(db, "questions", targetQId)),
                        user ? getDoc(doc(db, "users", user.uid, "wrong_answers", targetQId)) : Promise.resolve(null)
                    ]);
                    
                    qData = qSnap.exists() ? qSnap.data() : null;
                    wData = wrongSnap && wrongSnap.exists() ? wrongSnap.data() : null;
                } catch (e) {
                    console.error("통계 로딩 중 오류:", e);
                }
            }

            // 가상 규준 통계 또는 실제 DB 통계 판별 (최소 30명 미만 표본은 규준 모수로 보정)
            let totalAttempts = 0;
            let correctRate = 0;
            let distractorStats = {};

            if (qData && qData.stats) {
                if (qData.stats.totalAttempts >= 30) {
                    totalAttempts = qData.stats.totalAttempts;
                    const correctCount = qData.stats.correctCount || 0;
                    correctRate = Math.round((correctCount / totalAttempts) * 100);
                    distractorStats = qData.distractorStats || {};
                } else if (qData.stats.total >= 30) {
                    totalAttempts = qData.stats.total;
                    const correctCount = qData.stats.correct || 0;
                    correctRate = Math.round((correctCount / totalAttempts) * 100);
                    distractorStats = qData.distractorStats || {};
                }
            }
            if (totalAttempts === 0) {
                // 전국 표준 규준 가상 표본 적용 (1,280명 기준)
                totalAttempts = 1280;
                correctRate = getEstimatedAccuracyRate(no, finalScore, normId);
                const wrongCount = Math.round(totalAttempts * (1 - correctRate / 100));
                const cAnsNum = parseInt(finalAns, 10);
                const trapChoice = (!isNaN(cAnsNum) && cAnsNum >= 1 && cAnsNum <= 5) ? ((cAnsNum % 5) + 1) : 4;
                for (let opt = 1; opt <= 5; opt++) {
                    if (opt === cAnsNum) {
                        distractorStats[opt] = Math.round(totalAttempts * (correctRate / 100));
                    } else if (opt === trapChoice) {
                        distractorStats[opt] = Math.round(wrongCount * 0.56);
                    } else {
                        distractorStats[opt] = Math.round(wrongCount * 0.14);
                    }
                }
            }

            let diagnosis = "";
            const diagColor = "text-yellow-800 bg-yellow-50 border-yellow-300";
            
            if (correctRate >= 70) {
                diagnosis = "다수의 학생들이 맞춘 <b>기본 개념 문항</b>입니다. 만약 틀렸다면 기초 복습이 시급합니다!";
            } else if (correctRate >= 40) {
                diagnosis = "개념의 정확한 적용을 묻는 <b>핵심 문항</b>입니다. 헷갈린 선지가 있다면 반드시 짚고 넘어가세요.";
            } else {
                diagnosis = "오답률이 높은 <b>킬러 문항</b>입니다! 좌절하지 말고 출제자의 의도를 파악해 보세요.";
            }
            
            statsHtml += `
                <div class="mb-5 ml-[50px] mr-5 p-3.5 rounded-xl border-2 ${diagColor} shadow-sm font-sans bg-opacity-90">
                    <div class="flex items-center gap-1.5 mb-1.5">
                        <span class="text-sm">📊</span>
                        <h3 class="font-bold text-[13.8px] leading-tight">전체 응시자 정답률: ${correctRate}%</h3>
                    </div>
                    <p class="text-[12.8px] leading-relaxed">💡 <b>핀셋 진단:</b> ${diagnosis}</p>
            `;
            
            const myMark = wData?.studentMark ? Number(wData.studentMark) : null;
            if (myMark && myMark > 0 && String(myMark) !== String(finalAns)) {
                let distCount = distractorStats[myMark] || 0;
                let distRate = Math.round((distCount / totalAttempts) * 100);
                if (distRate === 0 || distRate >= 75) {
                    distRate = Math.max(16, Math.min(38, Math.round((100 - correctRate) * 0.52)));
                }
                statsHtml += `
                    <div class="mt-2.5 pt-2 border-t border-black/10 flex items-start gap-1.5">
                        <span class="text-sm">🚨</span>
                        <p class="text-[12.8px] leading-relaxed">
                            <b>매력적인 오답 경보:</b> 내가 고른 <b>${myMark}번</b> 선지는 전체 응시자의 <b>${distRate}%</b>가 낚인 함정이었습니다. 당신만 틀린 게 아니에요!
                        </p>
                    </div>
                `;
            }
            statsHtml += `</div>`;
            
            setTimeout(() => {
                qNumTitle.innerHTML = `<span class="text-indigo-600 mr-2">Q${no}.</span>${topic}`;
                
                // 배점과 정답 뱃지 표출

                document.getElementById('current-info-badges').innerHTML = `
                    <span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded border border-yellow-200 text-[11px] font-bold">배점 ${finalScore}점</span>
                    <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded border border-blue-200 text-[11px] font-bold">정답 ${finalAns}</span>
                `;
                
                noteArea.innerHTML = statsHtml + `<div class="explanation-body leading-[30px] pt-2 pb-32">${content}</div>`;
                noteArea.style.opacity = 1;
                noteArea.style.transition = "opacity 0.3s ease-in-out";
                
                if (window.MathJax) {
                    MathJax.typesetPromise([noteArea, qNumTitle]).catch((err) => console.log('MathJax error: ', err));
                }
            }, 50);
        };
    </script>
</body>
</html>
