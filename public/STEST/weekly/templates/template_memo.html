<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../weekly_common.css">
    <style>
        body { background: #cbd5e1; margin: 0; padding: 0; display: flex; justify-content: center; font-family: 'Noto Sans KR', sans-serif; }
        .a4-page { width: 500px !important; height: 707px !important; background: #ffffff !important; position: relative; box-sizing: border-box; overflow: hidden; padding: 25px 28px; }
        .memo-title { font-size: 16px; font-weight: 900; color: #0f172a; border-bottom: 2px solid #0284c7; padding-bottom: 6px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .memo-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 10.5px; line-height: 1.5; color: #334155; }
        .memo-box-title { font-weight: 800; color: #0284c7; margin-bottom: 4px; font-size: 11px; }
        .point-box { background: #fefce8; border: 1px solid #fef08a; border-radius: 8px; padding: 10px 12px; font-size: 10px; line-height: 1.5; color: #854d0e; }
        .page-num { position: absolute; bottom: 10px; left: 0; width: 100%; text-align: center; font-size: 11px; color: #64748b; font-weight: 700; font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body>
    <div class="a4-page spread-page">
        <div class="memo-title">갓쌤의 실전 암기장 ✍️</div>
        
        <div class="memo-box">
            <div class="memo-box-title">1. 핵심 개념 및 공식 정리</div>
            여기에 핵심 요약 내용을 입력하세요. 표나 다이어그램을 배치하기에 적합합니다.
        </div>

        <div class="memo-box">
            <div class="memo-box-title">2. 시험 빈출 비교표</div>
            구분, 특징, 출제 포인트를 일목요연하게 비교 정리합니다.
        </div>

        <div class="point-box">
            <div style="font-weight: 900; margin-bottom: 4px;">📌 갓쌤의 출제 포인트!</div>
            함정에 빠지기 쉬운 보기나 출제위원의 낚시 포인트를 정리합니다.
        </div>

        <div class="page-num">- 08 -</div>
    </div>
</body>
</html>
