<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 처리 중...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
        <div id="loading" class="space-y-4">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <h2 class="text-xl font-bold text-gray-900">결제를 확인하고 있습니다</h2>
            <p class="text-gray-500 text-sm">잠시만 기다려주세요...</p>
        </div>
        
        <div id="success" class="space-y-4 hidden">
            <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">결제 완료!</h2>
            <p class="text-gray-600">구독 권한이 정상적으로 부여되었습니다.</p>
            <button onclick="location.href='../weekly_info.html'" class="mt-6 w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-500 transition-colors">이전 화면으로 돌아가기</button>
        </div>

        <div id="error" class="space-y-4 hidden">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">결제 처리 실패</h2>
            <p id="error-message" class="text-red-500 text-sm break-words"></p>
            <button onclick="location.href='../weekly_info.html'" class="mt-6 w-full py-3 bg-gray-600 text-white rounded-xl font-bold hover:bg-gray-500 transition-colors">돌아가기</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyDYljyALj-RbHKjndZYXcOaPzK-Q6xBjjo", authDomain: "godtonggwa.firebaseapp.com", projectId: "godtonggwa", storageBucket: "godtonggwa.firebasestorage.app", messagingSenderId: "1087434066468", appId: "1:1087434066468:web:00a75c9329543afc76e6b1" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get("paymentKey");
        const orderId = urlParams.get("orderId");
        const amount = urlParams.get("amount");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (!paymentKey || !orderId || !amount) {
                    showError("잘못된 접근입니다. (결제 정보 누락)");
                    return;
                }

                try {
                    // Extract packageId from orderId (e.g. weekly_winter_2028__123456)
                    const packageId = orderId.split('__')[0];

                    const idToken = await user.getIdToken();
                    
                    const response = await fetch('https://us-central1-godtonggwa.cloudfunctions.net/confirmTossPayment', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${idToken}`
                        },
                        body: JSON.stringify({
                            paymentKey,
                            orderId,
                            amount,
                            packageId
                        })
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        showSuccess();
                    } else {
                        showError(result.message || "서버에서 결제를 승인하지 않았습니다.");
                    }
                } catch (error) {
                    console.error("Payment Confirmation Error:", error);
                    showError(error.message || "결제 확인 중 서버와 통신할 수 없습니다.");
                }
            } else {
                showError("로그인이 필요합니다. 다시 로그인해주세요.");
            }
        });

        function showSuccess() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error-message').innerText = msg;
        }
    </script>
</body>
</html>
