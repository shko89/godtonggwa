<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학습 커뮤니티 - 갓통과</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #F9FAFB;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .fab {
            position: absolute;
            bottom: 100px;
            right: 20px;
            z-index: 40;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="app-container" id="app">
        <!-- 상단 헤더 -->
        <header class="bg-white/90 backdrop-blur-md px-4 py-4 flex items-center sticky top-0 z-50 border-b border-gray-100 h-[80px]">
            <button onclick="location.href='../index.html'" class="p-2 -ml-2 hover:bg-gray-50 rounded-full transition-colors mr-2">
                <i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i>
            </button>
            <div class="flex flex-col flex-1">
                <h1 class="text-xl font-bold text-gray-900 leading-tight">Q&A 학습 커뮤니티</h1>
                <p class="text-[11px] text-indigo-500 font-medium">AI 튜터와 통과 마스터가 답변해 드려요!</p>
            </div>
            <!-- 실제 권한 상태 표시 뱃지 -->
            <div id="auth-badge" class="px-2 py-1 rounded text-[10px] font-bold bg-gray-100 text-gray-500">
                상태 확인 중...
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main id="board-content" class="flex-1 overflow-y-auto hide-scrollbar relative pb-24">
            <div class="flex flex-col items-center justify-center h-full text-gray-400">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4 text-indigo-500"></i>
                <p class="text-sm">게시판을 불러오는 중...</p>
            </div>
        </main>

        <!-- 하단 네비게이션 바 -->
        <nav class="bg-white border-t border-gray-100 px-6 py-3 flex justify-between items-center fixed bottom-0 w-full max-w-[480px] z-50 pb-6 shadow-[0_-5px_15px_rgba(0,0,0,0.02)] h-[80px]">
            <button onclick="location.href='../index.html'" class="nav-btn text-gray-500 flex flex-col items-center gap-1 transition-colors">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[11px] font-bold tracking-tight">홈</span>
            </button>
            
            <button onclick="location.href='../STEST/exam.html'" class="nav-btn text-gray-500 flex flex-col items-center gap-1 transition-colors">
                <i data-lucide="file-text" class="w-6 h-6"></i>
                <span class="text-[11px] font-bold tracking-tight">모의고사</span>
            </button>
            
            <button onclick="location.href='../Q-Bank/student_quiz.html'" class="nav-btn flex flex-col items-center gap-1 -mt-8 group">
                <div class="bg-gray-900 p-4 rounded-full shadow-lg shadow-gray-300 group-hover:scale-105 transition-transform group-active:scale-95 border-4 border-white">
                    <i data-lucide="brain-circuit" class="w-7 h-7 text-white"></i>
                </div>
                <span class="text-[11px] font-bold text-gray-700 mt-1 tracking-tight">문제은행</span>
            </button>
            
            <button onclick="location.href='../archive/archive.html'" class="nav-btn text-gray-500 flex flex-col items-center gap-1 transition-colors">
                <i data-lucide="book-open" class="w-6 h-6"></i>
                <span class="text-[11px] font-bold tracking-tight">기출학습</span>
            </button>
            
            <button onclick="location.href='../index.html?view=my'" class="nav-btn text-gray-500 flex flex-col items-center gap-1 transition-colors">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[11px] font-bold tracking-tight">마이</span>
            </button>
        </nav>

        <!-- 로그인 안내 모달 -->
        <div id="login-modal" class="fixed inset-0 bg-black/50 items-center justify-center z-[100] p-4 hidden">
            <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center animate-in zoom-in duration-200">
                <i data-lucide="lock" class="w-12 h-12 text-indigo-500 mx-auto mb-4"></i>
                <h3 class="text-xl font-bold text-gray-800 mb-2">로그인이 필요합니다</h3>
                <p class="text-gray-500 text-sm mb-6 leading-relaxed">
                    게시글 작성 및 댓글 기능은<br/>갓통과 정식 회원만 이용 가능합니다.
                </p>
                <div class="flex gap-2 justify-center">
                    <button onclick="window.closeModal()" class="px-4 py-2.5 rounded-lg bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 w-1/3 transition-colors">
                        닫기
                    </button>
                    <!-- 로그인 완료 후 확실하게 되돌아오기 위해 함수 호출 -->
                    <button onclick="location.href='../STEST/exam.html?returnTo=board_write'" class="px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-bold hover:bg-indigo-700 flex-1 transition-colors">
                        로그인하러 가기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase 및 로직 -->
    <script type="module">
        // [핵심 패치 1] exam.html과 완전히 똑같은 v10.7.1 버전을 사용하여 세션을 100% 공유합니다.
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, getDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // [핵심 패치 2] 테스트 DB 연결 우회 코드를 걷어내고, 오너님의 DB로 완벽하게 고정합니다.
        const firebaseConfig = {
            apiKey: "AIzaSyDYljyALj-RbHKjndZYXcOaPzK-Q6xBjjo",
            authDomain: "godtonggwa.firebaseapp.com",
            projectId: "godtonggwa",
            storageBucket: "godtonggwa.firebasestorage.app",
            messagingSenderId: "1087434066468",
            appId: "1:1087434066468:web:00a75c9329543afc76e6b1"
        };
        const appId = 'godtonggwa_v1';
        // [보안 패치] 클라이언트에서 API 키 보관 금지 (백엔드 위임)

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 상태 관리
        let currentUser = null;
        let currentUserName = '갓통과 회원';
        let posts = [];
        let currentView = 'list'; 
        let activeCategory = 'qna';
        let selectedPostId = null;
        let isDataFetched = false;
        let searchQuery = '';

        const CATEGORIES = [
            { id: 'qna', name: '문항 Q&A', icon: 'message-square', description: '모의고사 문항 질문, 헷갈리는 개념 등을 질문하는 곳입니다. 질문을 올리면 AI 튜터가 즉시 힌트를 제공합니다.' },
            { id: 'lounge', name: '수험생 라운지', icon: 'user', description: '공부 팁, 수험 생활 고민 등을 자유롭게 나누는 소통 공간입니다.' },
            { id: 'suggestion', name: '건의사항', icon: 'info', description: '앱 버그, 문항 오류 신고, 갓통과에 바라는 점을 직접 제안하는 채널입니다.' }
        ];

        // [핵심 패치 3] 안전한 세션 복원 및 이름 가져오기
        async function initializeAppAuth() {
            try {
                await auth.authStateReady();

                // 로그인 세션이 없으면 게스트 권한 부여
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("인증 초기화 에러:", e);
            }

            onAuthStateChanged(auth, async (user) => {
                const badge = document.getElementById('auth-badge');
                badge.style.display = 'block';
                
                if (user && !user.isAnonymous) {
                    currentUser = user;
                    
                    // DB에서 회원 이름 가져오기
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists() && userDoc.data().name) {
                            currentUserName = userDoc.data().name;
                        } else {
                            currentUserName = user.email.split('@')[0];
                        }
                    } catch(e) {}

                    badge.className = "px-2 py-1 rounded text-[10px] font-bold transition-colors bg-indigo-100 text-indigo-600";
                    badge.innerText = "회원 접속됨";
                } else {
                    currentUser = null; 
                    currentUserName = '익명';
                    badge.className = "px-2 py-1 rounded text-[10px] font-bold transition-colors bg-gray-100 text-gray-500";
                    badge.innerText = "읽기 전용 (비회원)";
                }

                if (user) {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('view') === 'write' && !user.isAnonymous) {
                        currentView = 'write';
                        window.history.replaceState({}, '', window.location.pathname);
                    }
                    if (!isDataFetched) {
                        fetchPosts();
                        isDataFetched = true;
                    }
                }
            });
        }

        initializeAppAuth();

        window.goToLogin = function() {
            localStorage.setItem('redirectAfterLogin', 'board');
            location.href = '../STEST/exam.html?returnTo=board';
        };

        const formatDate = (timestamp) => {
            const date = new Date(timestamp);
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
            }
            return `${date.getMonth() + 1}/${date.getDate()}`;
        };

        function fetchPosts() {
            if (posts.length > 0) return; // 중복 호출 방지

            const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'godtonggwa_board');
            // [데이터 절약 패치] 전체 문서를 불러오지 않고 최신 50개만 가져옵니다.
            const q = query(postsRef, orderBy('createdAt', 'desc'), limit(50));
            onSnapshot(q, (snapshot) => {
                posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                posts.sort((a, b) => b.createdAt - a.createdAt);
                renderCurrentView();
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        function renderCurrentView() {
            if (currentView === 'list') renderList();
            else if (currentView === 'detail') renderDetail();
            else if (currentView === 'write') renderWrite();
        }

        window.closeModal = function() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('flex');
        };

        window.changeCategory = function(catId) {
            activeCategory = catId;
            searchQuery = ''; 
            renderList();
        };

        window.searchPosts = function(query) {
            searchQuery = query.trim();
            renderList();
        };

        window.renderList = function() {
            currentView = 'list';
            const container = document.getElementById('board-content');
            
            const filteredPosts = posts.filter(p => {
                const matchCategory = p.category === activeCategory;
                const matchSearch = searchQuery === '' || 
                                    p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    p.content.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });
            
            const activeCatObj = CATEGORIES.find(c => c.id === activeCategory);

            let html = `<div class="fade-in">`;

            html += `<div class="bg-white flex border-b border-gray-200 sticky top-0 z-40 px-2 shadow-sm">`;
            CATEGORIES.forEach(cat => {
                const isActive = cat.id === activeCategory;
                const activeClasses = isActive ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-400 hover:text-gray-600';
                html += `
                    <button onclick="window.changeCategory('${cat.id}')" class="flex-1 py-3 text-sm font-bold border-b-2 transition-colors flex items-center justify-center gap-1.5 ${activeClasses}">
                        ${isActive ? `<i data-lucide="${cat.icon}" class="w-4 h-4"></i>` : ''}
                        ${cat.name}
                    </button>
                `;
            });
            html += `</div>`;

            html += `
            <div class="px-5 py-3 bg-white border-b border-gray-100 flex gap-2 items-center">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="text" id="search-input" value="${searchQuery}" placeholder="게시글 검색..." 
                           class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition-colors"
                           onkeyup="if(event.key === 'Enter') window.searchPosts(this.value)">
                </div>
                <button onclick="window.searchPosts(document.getElementById('search-input').value)" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700 transition">검색</button>
            </div>
            `;

            html += `
                <div class="px-5 py-3 border-b flex items-start gap-3 bg-indigo-50 border-indigo-100">
                    <div class="shrink-0 mt-0.5 text-indigo-500">
                        <i data-lucide="${activeCatObj.icon}" class="w-4 h-4"></i>
                    </div>
                    <p class="text-xs font-medium leading-relaxed text-indigo-800">
                        ${activeCatObj.description}
                    </p>
                </div>
                <div class="divide-y divide-gray-100 pb-20">
            `;

            if (filteredPosts.length === 0) {
                html += `
                    <div class="py-20 flex flex-col items-center text-gray-400">
                        <i data-lucide="message-square-dashed" class="w-12 h-12 mb-3 text-gray-300"></i>
                        <p class="text-sm">${searchQuery ? `'${searchQuery}' 검색 결과가 없습니다.` : '등록된 질문이 없습니다.'}</p>
                    </div>`;
            } else {
                filteredPosts.forEach(post => {
                    const commentCount = post.comments ? post.comments.length : 0;
                    const hasAiAnswer = post.comments && post.comments.some(c => c.isAi);
                    
                    html += `
                        <div onclick="window.goDetail('${post.id}')" class="bg-white p-5 cursor-pointer hover:bg-gray-50 transition-colors active:bg-gray-100">
                            <div class="flex items-start justify-between mb-2 gap-3">
                                <h3 class="font-bold text-gray-800 leading-snug line-clamp-2 flex-1">${post.title}</h3>
                            </div>
                            <div class="flex items-center gap-2 mb-2">
                                ${hasAiAnswer ? `<span class="bg-indigo-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1"><i data-lucide="bot" class="w-3 h-3"></i>AI 답변완료</span>` : ''}
                            </div>
                            <p class="text-xs text-gray-500 line-clamp-1 mb-3">${post.content}</p>
                            <div class="flex justify-between items-center text-[11px] text-gray-400">
                                <div class="flex items-center gap-3">
                                    <span class="font-medium text-gray-600">${post.authorName || '갓통과 회원'}</span>
                                    <span>${formatDate(post.createdAt)}</span>
                                </div>
                                <div class="flex items-center gap-1.5 font-medium ${commentCount > 0 ? 'text-indigo-500' : ''}">
                                    <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> ${commentCount}
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>
                <button onclick="window.goWrite()" class="fab w-14 h-14 bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-all text-white rounded-full flex items-center justify-center">
                    <i data-lucide="pen-tool" class="w-6 h-6"></i>
                </button>
            </div>`;
            
            container.innerHTML = html;
            lucide.createIcons();
            container.scrollTop = 0;
            document.querySelector('header button').setAttribute('onclick', "location.href='../index.html'");
        };

        window.goDetail = function(id) {
            selectedPostId = id;
            currentView = 'detail';
            renderDetail();
        };

        window.renderDetail = function() {
            const post = posts.find(p => p.id === selectedPostId);
            if (!post) { currentView = 'list'; return renderList(); }
            
            const container = document.getElementById('board-content');
            
            let html = `
                <div class="fade-in pb-20">
                    <div class="bg-white p-5 border-b border-gray-100">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="bg-indigo-50 text-indigo-600 text-[10px] font-bold px-2 py-0.5 rounded">${CATEGORIES.find(c => c.id === post.category)?.name}</span>
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 mb-4 leading-snug">${post.title}</h2>
                        <div class="flex justify-between items-center text-xs text-gray-500">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 bg-gray-100 rounded-full flex items-center justify-center text-gray-400"><i data-lucide="user" class="w-3 h-3"></i></div>
                                <span class="font-bold text-gray-700">${post.authorName || '갓통과 회원'}</span>
                            </div>
                            <span>${new Date(post.createdAt).toLocaleString()}</span>
                        </div>
                    </div>
                    
                    <div class="bg-white p-5 min-h-[150px] text-gray-800 text-sm leading-relaxed whitespace-pre-wrap">
                        ${post.content}
                    </div>
                    
                    <div class="bg-gray-50 p-5">
                        <h3 class="font-bold text-sm text-gray-800 mb-4 flex items-center gap-2">
                            답변 <span class="text-indigo-600">${post.comments ? post.comments.length : 0}</span>
                        </h3>
                        
                        <div class="space-y-4 mb-6">
            `;

            if (post.comments && post.comments.length > 0) {
                post.comments.forEach(c => {
                    const isAi = c.isAi;
                    html += `
                        <div class="p-4 rounded-2xl ${isAi ? 'bg-white border-2 border-indigo-100 shadow-sm' : 'bg-white border border-gray-100'}">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    ${isAi ? `<div class="w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-white"><i data-lucide="sparkles" class="w-3 h-3"></i></div>` 
                                           : `<div class="w-6 h-6 bg-gray-200 rounded-full flex items-center justify-center text-gray-500"><i data-lucide="user" class="w-3 h-3"></i></div>`}
                                    <span class="font-bold text-xs ${isAi ? 'text-indigo-700' : 'text-gray-700'}">${c.authorName}</span>
                                </div>
                                <span class="text-[10px] text-gray-400">${formatDate(c.createdAt)}</span>
                            </div>
                            <div class="text-sm ${isAi ? 'text-indigo-900 font-medium' : 'text-gray-700'} leading-relaxed whitespace-pre-wrap pl-8">
                                ${c.text}
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `<div class="text-center py-6 text-xs text-gray-400">아직 등록된 답변이 없습니다.<br>통과 마스터나 AI 튜터의 답변을 기다려주세요!</div>`;
            }

            const inputDisabledClass = currentUser ? "" : "pointer-events-none opacity-50";
            const btnColorClass = currentUser ? "bg-indigo-600 text-white hover:bg-indigo-700" : "bg-gray-200 text-gray-400";
            const placeholderText = currentUser ? "답변이나 의견을 남겨주세요." : "로그인 후 작성 가능합니다.";

            html += `
                        </div>
                    </div>
                    
                    <div class="fixed bottom-[80px] w-full max-w-[480px] bg-white border-t border-gray-200 p-3 flex gap-2 z-40">
                        <input type="text" id="comment-input" placeholder="${placeholderText}" 
                            onclick="if(!currentUser) { document.getElementById('login-modal').classList.remove('hidden'); document.getElementById('login-modal').classList.add('flex'); }" ${currentUser ? '' : 'readonly'}
                            class="flex-1 bg-gray-100 border-none rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="window.submitComment()" class="${btnColorClass} px-4 rounded-xl font-bold flex items-center justify-center active:scale-95 transition-transform ${inputDisabledClass}">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            lucide.createIcons();
            document.querySelector('header button').setAttribute('onclick', 'window.renderList()');
        };

        window.goWrite = function() {
            if (!currentUser) {
                document.getElementById('login-modal').classList.remove('hidden');
                document.getElementById('login-modal').classList.add('flex');
                return;
            }
            currentView = 'write';
            renderWrite();
        };

        function renderWrite() {
            const container = document.getElementById('board-content');
            
            const html = `
                <div class="fade-in bg-white h-full p-5 flex flex-col">
                    <h2 class="text-lg font-bold text-gray-900 mb-6 border-b pb-3 border-gray-100">질문 작성하기</h2>
                    
                    <div class="flex flex-col gap-4 flex-1">
                        <div>
                            <input type="text" id="post-title" placeholder="제목 (예: 3회차 14번 문항 자료 해석)" 
                                class="w-full text-base font-bold text-gray-800 placeholder-gray-300 border-b border-gray-200 py-3 focus:outline-none focus:border-indigo-500 transition-colors">
                        </div>
                        <div class="flex-1 relative">
                            <textarea id="post-content" placeholder="궁금한 내용을 자세히 적어주세요.&#10;정량적 그래프나 세포 모식도 등 문항의 조건도 함께 적어주시면 AI 튜터가 더 정확한 힌트를 제공합니다." 
                                class="w-full h-full text-sm text-gray-700 placeholder-gray-400 border border-gray-200 rounded-xl p-4 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent leading-relaxed"></textarea>
                        </div>
                    </div>
                    
                    <button onclick="window.submitPost()" class="w-full bg-indigo-600 text-white font-bold text-base py-4 rounded-xl shadow-lg mt-6 hover:bg-indigo-700 active:scale-95 transition-transform">
                        등록하기
                    </button>
                </div>
            `;
            
            container.innerHTML = html;
            lucide.createIcons();
            document.querySelector('header button').setAttribute('onclick', 'window.renderList()');
        };

        window.submitPost = async function() {
            if (!currentUser) return;
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            
            if (!title || !content) return alert("제목과 내용을 모두 입력해주세요.");
            
            const newPost = {
                title,
                content,
                authorId: currentUser.uid,
                authorName: currentUserName,
                createdAt: Date.now(),
                category: activeCategory,
                comments: []
            };

            try {
                const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'godtonggwa_board');
                const docRef = await addDoc(postsRef, newPost);
                
                searchQuery = '';
                renderList();
                
                if (activeCategory === 'qna') {
                    triggerAITutor(docRef.id, title, content);
                }
            } catch (error) {
                console.error("Post Write Error:", error);
                alert("게시글 작성 중 오류가 발생했습니다.");
            }
        };

        window.submitComment = async function() {
            if (!currentUser) return;
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text || !selectedPostId) return;

            const post = posts.find(p => p.id === selectedPostId);
            const newComment = {
                text,
                authorId: currentUser.uid,
                authorName: currentUserName,
                isAi: false,
                createdAt: Date.now()
            };

            try {
                const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'godtonggwa_board', selectedPostId);
                await updateDoc(postRef, {
                    comments: [...(post.comments || []), newComment]
                });
                input.value = '';
            } catch (error) {
                console.error("Comment Error:", error);
            }
        };

        async function triggerAITutor(postId, title, content) {
            try {
                // [보안 패치] 클라이언트에서 직접 API를 호출하지 않고, Cloud Functions가 감지할 수 있도록 요청 큐(Queue)를 생성합니다.
                const aiQueueRef = collection(db, 'ai_tutor_queue');
                await addDoc(aiQueueRef, {
                    postId: postId,
                    title: title,
                    content: content,
                    status: 'pending',
                    createdAt: Date.now()
                });
                console.log("AI 답변 요청이 안전하게 백엔드 큐에 등록되었습니다.");
            } catch (error) { console.error("AI Request Queueing failed:", error); }
        }

    </script>
</body>
</html>
