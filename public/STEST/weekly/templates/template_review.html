<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../weekly_common.css">
    <style>
        body { background: #cbd5e1; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; font-family: 'Noto Sans KR', sans-serif; }
        .a4-page { width: 500px !important; height: 707px !important; background: #ffffff !important; position: relative; box-sizing: border-box; overflow: hidden; padding: 25px 28px; }
        .review-banner { background: #e0f2fe; border-left: 4px solid #0284c7; padding: 8px 12px; border-radius: 0 8px 8px 0; margin-bottom: 10px; }
        .review-title { font-size: 13px; font-weight: 900; color: #0f172a; margin-bottom: 3px; }
        .review-desc { font-size: 10px; color: #475569; margin: 0; line-height: 1.45; }
        .prob-columns { display: flex; gap: 14px; margin-top: 6px; }
        .prob-col { flex: 1; }
        .ans-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
        .page-num { position: absolute; bottom: 10px; left: 0; width: 100%; text-align: center; font-size: 11px; color: #64748b; font-weight: 700; font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body>
    <!-- Page 1: 복습 2문항 페이지 -->
    <div class="a4-page spread-page">
        <div class="review-banner">
            <div class="review-title">🧭 수능의 나침반 : 실전 체화</div>
            <p class="review-desc">앞서 학습한 핵심 원리를 내 것으로 만들기 위한 변형 쌍둥이 문항입니다.</p>
        </div>
        <div class="prob-columns">
            <div class="prob-col">
                <div style="font-size: 10.5px; font-weight: 700; color: #0f172a; margin-bottom: 4px;">1. 문제 내용 서술...</div>
                <img src="sample_q1.webp" alt="1번 문항" style="max-width: 100%; max-height: 380px; object-fit: contain;">
            </div>
            <div class="prob-col" style="border-left: 1px dashed #cbd5e1; padding-left: 10px;">
                <div style="font-size: 10.5px; font-weight: 700; color: #0f172a; margin-bottom: 4px;">2. 문제 내용 서술...</div>
                <img src="sample_q2.webp" alt="2번 문항" style="max-width: 100%; max-height: 380px; object-fit: contain;">
            </div>
        </div>
        <div class="page-num">- 11 -</div>
    </div>

    <!-- Page 2: 해설 페이지 -->
    <div class="a4-page spread-page">
        <div style="font-size: 13.5px; font-weight: 900; color: #0f172a; border-bottom: 2px solid #0f172a; padding-bottom: 4px; margin-bottom: 10px;">실전 체화 - 정답 및 상세 해설</div>
        <div class="ans-card">
            <div style="font-weight: 900; color: #0284c7; margin-bottom: 4px;">[1번 문항 해설] 정답 ④</div>
            <div style="font-size: 10px; color: #334155; line-height: 1.5;">1번 문항에 대한 명쾌하고 친절한 해설입니다.</div>
        </div>
        <div class="ans-card">
            <div style="font-weight: 900; color: #0284c7; margin-bottom: 4px;">[2번 문항 해설] 정답 ②</div>
            <div style="font-size: 10px; color: #334155; line-height: 1.5;">2번 문항에 대한 명쾌하고 친절한 해설입니다.</div>
        </div>
        <div class="page-num">- 12 -</div>
    </div>
</body>
</html>
