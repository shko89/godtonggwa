<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갓통과 결제 승인 처리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>body { font-family: 'Pretendard', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-slate-100">
        <!-- 로딩 인디케이터 -->
        <div id="loading" class="space-y-4 py-8">
            <div class="w-14 h-14 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <h2 class="text-xl font-black text-slate-800">결제를 안전하게 승인하고 있습니다</h2>
            <p class="text-slate-500 text-sm">토스페이먼츠 및 서비스 권한을 동기화 중입니다.<br>잠시만 기다려주세요...</p>
        </div>
        
        <!-- 결제 성공 화면 -->
        <div id="success" class="space-y-5 hidden py-4">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <div>
                <h2 class="text-2xl font-black text-slate-900">결제가 완료되었습니다!</h2>
                <p id="success-package-name" class="text-indigo-600 font-bold text-sm mt-1">이용 권한이 즉시 활성화되었습니다.</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl text-left text-xs text-slate-500 space-y-1.5 border border-slate-100">
                <div class="flex justify-between"><span>주문 번호</span><span id="res-orderId" class="font-mono text-slate-700"></span></div>
                <div class="flex justify-between"><span>결제 금액</span><span id="res-amount" class="font-bold text-slate-900"></span></div>
            </div>
            <div class="space-y-2 pt-2">
                <button id="btn-primary-go" onclick="goToDestination()" class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">
                    서비스 바로 시작하기
                </button>
                <button onclick="location.href='exam.html'" class="w-full py-2.5 text-slate-400 hover:text-slate-600 text-xs font-semibold transition">
                    모의고사 홈으로 이동
                </button>
            </div>
        </div>

        <!-- 결제 실패 화면 -->
        <div id="error" class="space-y-5 hidden py-4">
            <div class="w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <div>
                <h2 class="text-2xl font-black text-slate-900">결제 승인 실패</h2>
                <p id="error-message" class="text-rose-500 text-sm mt-2 break-words px-2"></p>
            </div>
            <button onclick="window.history.back()" class="w-full py-3.5 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 transition">
                이전 화면으로 돌아가기
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        import { firebaseConfig } from "/firebase-config.js";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get("paymentKey");
        const orderId = urlParams.get("orderId");
        const amount = urlParams.get("amount");

        let targetUrl = 'exam.html';

        window.goToDestination = () => {
            window.location.href = targetUrl;
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (!paymentKey || !orderId || !amount) {
                    showError("결제 정보(paymentKey / orderId / amount)가 누락되었습니다.");
                    return;
                }

                try {
                    // Extract packageId from orderId (format: packageId__timestamp)
                    const packageId = orderId.split('__')[0];

                    if (packageId.includes('week')) {
                        targetUrl = '../weekly_info.html';
                    } else if (packageId.includes('infinity') || packageId.includes('allpass')) {
                        targetUrl = 'exam.html';
                    } else {
                        targetUrl = 'exam.html';
                    }

                    const idToken = await user.getIdToken();
                    
                    const response = await fetch('https://us-central1-godtonggwa.cloudfunctions.net/confirmTossPayment', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${idToken}`
                        },
                        body: JSON.stringify({
                            paymentKey,
                            orderId,
                            amount: Number(amount),
                            packageId
                        })
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        showSuccess(orderId, amount, packageId);
                    } else {
                        showError(result.message || "서버에서 결제를 승인하지 않았습니다.");
                    }
                } catch (error) {
                    console.error("Payment Confirmation Error:", error);
                    showError(error.message || "결제 확인 중 통신 오류가 발생했습니다.");
                }
            } else {
                showError("로그인이 필요한 상태입니다. 로그인 후 다시 확인해 주시기 바랍니다.");
            }
        });

        function showSuccess(oid, amt, pkgId) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');
            document.getElementById('res-orderId').innerText = oid;
            document.getElementById('res-amount').innerText = Number(amt).toLocaleString() + '원';

            const nameEl = document.getElementById('success-package-name');
            if (pkgId.includes('infinity') || pkgId.includes('allpass')) {
                nameEl.innerText = "2028 인피니티 올패스 전권 이용 권한이 활성화되었습니다.";
            } else if (pkgId.includes('week')) {
                nameEl.innerText = "갓통과 WEEKLY 주간지 10주 플랜 이용 권한이 활성화되었습니다.";
            } else {
                nameEl.innerText = "모의고사 패키지 이용 권한이 활성화되었습니다.";
            }
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error-message').innerText = msg;
        }
    </script>
</body>
</html>
