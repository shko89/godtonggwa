<script>
// 데스크탑에서 모바일 레이아웃(480px) 바깥의 회색 배경에서 마우스 휠을 돌릴 때, 
// 내부 스크롤 영역이 대신 스크롤되도록 이벤트를 위임합니다.
window.addEventListener('wheel', (e) => {
    if (!e.target.closest('.overflow-y-auto')) {
        const scrollContainers = document.querySelectorAll('.overflow-y-auto');
        // 화면에 보이는 스크롤 컨테이너 중 가장 나중에 나타나는(보통 모달이거나 메인 컨텐츠) 컨테이너를 찾습니다.
        const activeContainer = Array.from(scrollContainers).reverse().find(el => el.offsetParent !== null);
        if (activeContainer) {
            activeContainer.scrollTop += e.deltaY;
        }
    }
}, { passive: true });

        let currentDomain = 'all';

        function setDomain(domain) {
            currentDomain = domain;
            document.querySelectorAll('.domain-nav').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderCards();
        }

        function renderCards() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            const filteredData = fullDB.filter(item => {
                const matchDomain = currentDomain === 'all' || item.domain === currentDomain;
                const pubText = Object.values(item.pubs).flat().map(p => `${p.title} ${p.desc}`).join(' ');
                const searchText = `${item.element} ${item.goal} ${pubText}`.toLowerCase();
                const matchSearch = searchText.includes(searchVal);
                return matchDomain && matchSearch;
            });

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-64 text-slate-400">
                    <i data-lucide="search-x" class="w-12 h-12 mb-4 opacity-50"></i>
                    <p class="font-bold">검색 결과가 없습니다.</p>
                </div>`;
                lucide.createIcons();
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-2xl shadow-sm mb-8 overflow-hidden";

                // Header
                let html = `
                    <div class="p-5 border-b border-slate-100 bg-slate-50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="bg-indigo-100 text-indigo-700 font-mono text-xs font-bold px-2 py-0.5 rounded">${item.id}</span>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${item.domain}</span>
                            </div>
                            <h3 class="text-xl font-black text-slate-800">${item.element}</h3>
                        </div>
                        <div class="bg-white border border-slate-200 p-3 rounded-lg md:max-w-md text-sm font-semibold text-slate-600 shadow-sm leading-relaxed">
                            <span class="text-indigo-500 font-black mr-1">목표:</span> ${item.goal}
                        </div>
                    </div>
                    <div class="p-6 grid grid-cols-1 xl:grid-cols-5 gap-5">
                `;

                // Publishers
                const pubKeys = [
                    { key: 'ks', name: '금성', colorClass: 'ks' },
                    { key: 'bs', name: '비상', colorClass: 'bs' },
                    { key: 'da', name: '동아', colorClass: 'da' },
                    { key: 'cj', name: '천재', colorClass: 'cj' },
                    { key: 'mr', name: '미래엔', colorClass: 'mr' }
                ];

                pubKeys.forEach(pub => {
                    const acts = item.pubs[pub.key];
                    html += `
                        <div class="flex flex-col border border-slate-200 rounded-xl overflow-hidden hover:shadow-md transition-shadow">
                            <div class="pub-header bg-${pub.colorClass}">
                                <span>${pub.name}</span>
                                <span class="bg-white/20 text-white text-[9px] px-1.5 py-0.5 rounded-full">${acts.length}</span>
                            </div>
                            <div class="bg-white flex-1 flex flex-col divide-y divide-slate-100">
                    `;
                    acts.forEach(act => {
                        html += `
                                <div class="activity-item group">
                                    <div class="mb-1.5 leading-snug">
                                        <span class="activity-type">${act.type}</span>
                                        <span class="text-[13px] font-bold text-slate-800 group-hover:text-${pub.colorClass} transition-colors">${act.title}</span>
                                    </div>
                                    <p class="text-xs text-slate-500 leading-relaxed">${act.desc}</p>
                                </div>
                        `;
                    });
                    html += `
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        // Initialize
        window.onload = renderCards;
    </script>
