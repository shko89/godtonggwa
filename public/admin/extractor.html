<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갓통과 - 기출 좌표 추출기 (UHD Data Editor)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: white; }
        #viewer-pane { scroll-behavior: auto; background-color: #020617; image-rendering: -webkit-optimize-contrast; }
        #pdf-render-container { position: relative; display: inline-block; cursor: crosshair; user-select: none; text-align: left; margin: 60px auto 150px auto; box-shadow: 0 0 80px rgba(0,0,0,0.9); background-color: white; }
        #pdf-canvas { display: block; }
        #selection-rect { position: absolute; border: 2px solid #6366f1; background-color: rgba(99, 102, 241, 0.2); pointer-events: none; display: none; z-index: 100; }
        .captured-rect { position: absolute; border: 1.5px solid #10b981; background-color: rgba(16, 185, 129, 0.1); pointer-events: none; z-index: 50; transition: all 0.2s; }
        .captured-rect.active { border: 3px solid #f43f5e; background-color: rgba(244, 63, 94, 0.2); z-index: 60; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .edit-mode-active { border: 2px solid #f43f5e !important; background-color: #2d0a11 !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 관리자 로그인 락 화면 -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950 z-[2000] flex flex-col items-center justify-center backdrop-blur-xl">
        <div class="bg-slate-900 p-8 rounded-2xl border border-white/10 shadow-2xl w-[400px]">
            <div class="flex items-center gap-3 mb-6 justify-center">
                <div class="bg-indigo-600 p-2 rounded-xl shadow-lg"><i data-lucide="shield-check" class="w-6 h-6 text-white"></i></div>
                <h2 class="text-xl font-black text-white tracking-widest">기출 좌표 추출기 (Pro)</h2>
            </div>
            <p class="text-center text-xs text-slate-400 mb-6 font-bold">등록된 최고 관리자 계정으로 접속하세요.</p>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-500 mb-1 block uppercase tracking-widest">Admin Email</label>
                    <input type="email" id="admin-email" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-bold text-white text-sm" placeholder="관리자 이메일 입력">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 mb-1 block uppercase tracking-widest">Password</label>
                    <input type="password" id="admin-password" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-bold text-white text-sm" placeholder="비밀번호 입력" onkeydown="if(event.key === 'Enter') handleLogin()">
                </div>
                <button onclick="handleLogin()" id="btn-login-submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl text-white font-black text-sm shadow-lg mt-2 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i> 접속 확인
                </button>
            </div>
        </div>
    </div>

    <header class="bg-slate-900 p-4 border-b border-white/5 flex justify-between items-center shrink-0 z-[100] shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-xl shadow-lg"><i data-lucide="highlighter" class="w-5 h-5 text-white"></i></div>
            <div>
                <h1 class="text-lg font-black text-white flex items-center gap-2">
                    기출 좌표 추출기 (Pro)
                    <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-rose-600 border border-white/10 text-slate-300 hover:text-white px-2 py-0.5 rounded transition-colors ml-2" title="로그아웃">
                        Logout
                    </button>
                </h1>
                <p class="text-[9px] text-indigo-400 font-bold uppercase mt-1 tracking-widest animate-pulse" id="admin-badge">Item Bank Metadata Editor</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 bg-black/40 px-4 py-2 rounded-2xl border border-white/10">
            <button onclick="changeZoom(-0.1)" class="p-1 hover:text-indigo-400"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
            <span id="zoom-label" class="text-[12px] font-black min-w-[50px] text-center">100%</span>
            <button onclick="changeZoom(0.1)" class="p-1 hover:text-indigo-400"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
        </div>

        <div class="flex gap-2">
            <input type="file" id="pdf-input" accept=".pdf" class="hidden">
            <button onclick="document.getElementById('pdf-input').click()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 border border-white/5">
                <i data-lucide="file-up" class="w-4 h-4"></i> PDF 로드
            </button>
            <button onclick="loadFromDB()" class="bg-indigo-900/50 hover:bg-indigo-900 border border-indigo-700 text-indigo-300 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
                <i data-lucide="cloud-download" class="w-4 h-4"></i> DB 로드
            </button>
            <button onclick="saveToDB()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg">
                <i data-lucide="save" class="w-4 h-4"></i> 전체 저장
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <div class="flex-1 overflow-auto custom-scrollbar text-center relative" id="viewer-pane">
            <div id="pdf-render-container">
                <canvas id="pdf-canvas"></canvas>
                <div id="selection-rect"></div>
                <div id="captured-layers"></div>
            </div>
        </div>

        <aside class="w-[400px] bg-slate-900 border-l border-white/5 flex flex-col shrink-0 shadow-2xl z-40 overflow-hidden">
            <div class="p-6 border-b border-white/5 bg-slate-900/50">
                <label class="text-[10px] uppercase font-black text-indigo-400 mb-2 block tracking-widest">Target Exam ID</label>
                <input type="text" id="target-exam-id" placeholder="예: mock_01" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 font-bold text-indigo-300 text-sm shadow-inner transition-all">
                
                <div class="mt-4 flex justify-between items-center mb-2">
                    <span class="text-[10px] text-slate-500 font-black uppercase">Navigation</span>
                    <span class="text-[10px] text-slate-400 font-bold" id="total-pages-label">Page 0 / 0</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="prevPage()" class="flex-1 bg-slate-800 py-2.5 rounded-xl hover:bg-indigo-600 transition-all border border-white/5"><i data-lucide="arrow-left" class="mx-auto w-4 h-4"></i></button>
                    <button onclick="nextPage()" class="flex-1 bg-slate-800 py-2.5 rounded-xl hover:bg-indigo-600 transition-all border border-white/5"><i data-lucide="arrow-right" class="mx-auto w-4 h-4"></i></button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
                
                <div id="edit-form-container" class="bg-black/30 p-5 rounded-2xl border border-white/5 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-white text-xs uppercase tracking-widest flex items-center gap-2"><i data-lucide="edit-3" class="w-4 h-4 text-indigo-500"></i> 문항 상세 설정</h2>
                        <span id="edit-mode-indicator" class="hidden text-[9px] font-black bg-rose-600 text-white px-2 py-0.5 rounded-full animate-pulse">EDITING Q<span id="editing-q-num-text"></span></span>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-black text-slate-500 mb-1 block">문항 번호</label>
                            <input type="number" id="q-num" value="1" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none focus:border-indigo-500 font-black">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-500 mb-1 block">정답</label>
                            <select id="q-ans" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none focus:border-emerald-500 font-bold text-emerald-400">
                                <option value="1">①</option><option value="2">②</option><option value="3" selected>③</option><option value="4">④</option><option value="5">⑤</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-black text-slate-500 mb-1 block">배점</label>
                            <select id="q-score" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none text-xs focus:border-indigo-500">
                                <option value="1.5">1.5점</option><option value="2.0" selected>2.0점</option><option value="2.5">2.5점</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-500 mb-1 block">체감 난이도</label>
                            <select id="q-difficulty" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none text-xs focus:border-rose-500">
                                <option value="1">1 (최하)</option><option value="2">2 (하)</option><option value="3" selected>3 (중)</option><option value="4">4 (상)</option><option value="5">5 (최상)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-black text-slate-500 mb-1 block">단원 (Topic)</label>
                            <select id="q-topic" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none text-[10px] focus:border-indigo-500">
                                <option value="미분류">단원 선택</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-500 mb-1 block">문항 유형</label>
                            <select id="q-type" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none text-[10px] focus:border-indigo-500">
                                <option value="단순선택형">단순선택형</option><option value="합답형(ㄱ,ㄴ,ㄷ)" selected>합답형(ㄱ,ㄴ,ㄷ)</option><option value="계산형">계산형</option><option value="순서배열형">순서배열형</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-[10px] font-black text-slate-500 mb-1 block">행동 영역 (과학적 탐구 역량)</label>
                        <select id="q-behavior" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none text-xs focus:border-indigo-500">
                            <option value="이해">1. 이해</option>
                            <option value="적용">2. 적용</option>
                            <option value="문제 인식 및 가설 설정">3. 문제 인식 및 가설 설정</option>
                            <option value="탐구 설계">4. 탐구 설계</option>
                            <option value="탐구 수행 및 자료 수집">5. 탐구 수행 및 자료 수집</option>
                            <option value="자료 변환 및 해석">6. 자료 변환 및 해석</option>
                            <option value="결론 도출 및 일반화">7. 결론 도출 및 일반화</option>
                            <option value="의사소통">8. 의사소통</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[10px] font-black text-slate-500 mb-1 block">주간지 문항 종류</label>
                        <select id="q-magazine-type" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none text-xs focus:border-indigo-500 font-bold text-amber-400">
                            <option value="prep">대비/예시 문항 (prep)</option>
                            <option value="prac" selected>실전 체화 문항 (prac)</option>
                            <option value="mock">타임어택 모의고사 (mock)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 mb-1 block">해시태그 (쉼표로 구분)</label>
                        <input type="text" id="q-tags" placeholder="예: #알칼리금속, #불꽃반응" class="w-full bg-slate-800 border border-white/10 rounded-xl px-4 py-2 outline-none text-xs focus:border-indigo-500 text-indigo-300 font-bold">
                    </div>

                    <button onclick="updateAndSaveSingle()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-black shadow-lg flex items-center justify-center gap-2 transition-all mt-2">
                        <i data-lucide="cloud-upload" class="w-4 h-4"></i> 이 문항 정보만 DB 업데이트
                    </button>
                </div>

                <div>
                    <h2 class="font-bold text-white text-[11px] uppercase tracking-widest opacity-60 mb-4">추출 목록 (<span id="captured-count">0</span>)</h2>
                    <div id="data-list" class="space-y-2"></div>
                </div>
            </div>
        </aside>
    </main>

    <div id="loading-overlay" class="hidden fixed inset-0 bg-black/95 z-[1000] flex flex-col items-center justify-center backdrop-blur-md">
        <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-6"></div>
        <p class="text-white font-black tracking-widest text-sm uppercase">Cloud Synchronizing...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDYljyALj-RbHKjndZYXcOaPzK-Q6xBjjo", 
            authDomain: "godtonggwa.firebaseapp.com", 
            projectId: "godtonggwa", 
            storageBucket: "godtonggwa.firebasestorage.app", 
            messagingSenderId: "1087434066468", 
            appId: "1:1087434066468:web:00a75c9329543afc76e6b1" 
        };
        const app = initializeApp(firebaseConfig);
        const appCheck = initializeAppCheck(app, {
            provider: new ReCaptchaEnterpriseProvider('6LdgWWstAAAAAJiXWFVDDXeMOHocUBgmQdA62zCR'),
            isTokenAutoRefreshEnabled: true
        }); 
        const auth = getAuth(app); 
        const db = getFirestore(app);
        const appId = 'godtonggwa_v1';

        // --- 관리자 이중 검증 로직 적용 ---
        const loginOverlay = document.getElementById('login-overlay');
        const loginBtn = document.getElementById('btn-login-submit');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // admin.html과 동일한 검증 로직 적용
                    const adminDoc = await getDoc(doc(db, "settings", "admin"));
                    if (adminDoc.exists() && adminDoc.data().adminEmail === user.email) {
                        loginOverlay.classList.add('hidden');
                        document.getElementById('admin-badge').innerText = `Admin Access: ${user.email}`;
                    } else {
                        // 권한이 없는 계정은 즉시 로그아웃 처리
                        alert("접근 권한이 없습니다. 등록된 관리자 계정이 아닙니다.");
                        await signOut(auth);
                        loginOverlay.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error("DB Check Error:", error);
                    alert("권한 검증 실패: " + error.message);
                    await signOut(auth);
                }
            } else {
                loginOverlay.classList.remove('hidden');
            }
        });

        window.handleLogin = async () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            if (!email || !password) return alert("이메일과 비밀번호를 입력하세요.");
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 확인 중...`;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // 성공 시 onAuthStateChanged가 발동하여 검증 진행
            } catch (error) {
                console.error(error);
                alert("로그인 실패: 이메일 또는 비밀번호가 틀렸습니다.");
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> 접속 확인`;
                lucide.createIcons();
            }
        };

        window.handleLogout = () => {
            if(confirm("기출 좌표 추출기에서 로그아웃 하시겠습니까?")) {
                signOut(auth);
            }
        };
        // ---------------------------------

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const TOPIC_MAP = { 
            "과학의 기초": ["기본량과 단위", "측정과 어림", "정보와 신호"], 
            "물질과 규칙성": ["원소 형성", "별의 진화", "원소의 주기성", "화학 결합", "지각과 생명체 구성 물질의 규칙성"], 
            "시스템과 상호작용": ["지구시스템의 구성과 상호작용", "판구조론과 지각 변동", "중력장 내의 운동", "충격량과 운동량", "생명 시스템의 기본 단위", "물질대사", "유전자와 단백질", "물질의 전기적 성질"], 
            "변화와 다양성": ["지질시대의 생물과 화석", "지질시대 환경 변화와 대멸종", "자연선택", "생물다양성", "산화와 환원", "중화 반응", "물질 변화에서 에너지 출입"], 
            "환경과 에너지": ["생태계 구성 요소", "생태계 평형", "대기와 해양의 상호작용", "온실기체와 지구온난화", "핵융합", "발전", "에너지 전환과 효율"], 
            "과학과 미래 사회": ["감염병과 병원체", "인공지능과 과학 탐구", "로봇", "과학기술과 윤리"] 
        };

        let pdfDoc = null, pageNum = 1, userScale = 1.0, currentData = {}, editingNum = null;
        const dpr = window.devicePixelRatio || 1, quality = 3.5;
        const canvas = document.getElementById('pdf-canvas'), ctx = canvas.getContext('2d');

        function initTopicSelect() {
            const select = document.getElementById('q-topic');
            Object.keys(TOPIC_MAP).forEach(chapter => {
                const group = document.createElement('optgroup'); group.label = chapter;
                TOPIC_MAP[chapter].forEach(t => { const opt = document.createElement('option'); opt.value = t; opt.innerText = t; group.appendChild(opt); });
                select.appendChild(group);
            });
        }
        window.onload = initTopicSelect; 

        document.getElementById('pdf-input').onchange = async (e) => {
            const file = e.target.files[0]; if(!file) return;
            document.getElementById('loading-overlay').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = async function() { pdfDoc = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise; pageNum = 1; renderPage(); };
            reader.readAsArrayBuffer(file);
        };

        async function renderPage() {
            if(!pdfDoc) return;
            const page = await pdfDoc.getPage(pageNum);
            const vp = page.getViewport({ scale: userScale * dpr * quality });
            canvas.width = vp.width; canvas.height = vp.height;
            canvas.style.width = (vp.width / (dpr * quality)) + "px";
            canvas.style.height = (vp.height / (dpr * quality)) + "px";
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
            document.getElementById('total-pages-label').innerText = `Page ${pageNum} / ${pdfDoc.numPages}`;
            document.getElementById('zoom-label').innerText = Math.round(userScale * 100) + '%';
            document.getElementById('loading-overlay').classList.add('hidden');
            updateDataList(); renderCapturedLayers();
        }

        window.prevPage = () => { if(pageNum > 1) { pageNum--; renderPage(); } };
        window.nextPage = () => { if(pageNum < pdfDoc.numPages) { pageNum++; renderPage(); } };
        window.changeZoom = (delta) => { userScale = Math.max(0.2, Math.min(4.0, userScale + delta)); renderPage(); };

        window.loadFromDB = async () => {
            const examId = document.getElementById('target-exam-id').value.trim();
            if(!examId) return alert("Exam ID 입력!");
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'archive_coords', examId));
                if (snap.exists()) {
                    currentData = snap.data().coords || {};
                    updateDataList(); renderCapturedLayers();
                    const keys = Object.keys(currentData).map(Number);
                    if(keys.length > 0) document.getElementById('q-num').value = Math.max(...keys) + 1;
                    alert("데이터를 성공적으로 불러왔습니다!");
                } else { alert("데이터가 없습니다."); currentData = {}; updateDataList(); }
            } catch (e) { alert("오류: " + e.message); }
            finally { document.getElementById('loading-overlay').classList.add('hidden'); }
        };

        const viewerPane = document.getElementById('viewer-pane'), container = document.getElementById('pdf-render-container'), selection = document.getElementById('selection-rect');
        let startX, startY, isDragging = false;
        
        let lastMouseE = null;
        let scrollYAmount = 0, scrollXAmount = 0;
        let autoScrollTimer = null;

        function getMousePos(e) { const rect = container.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

        function updateSelection(e) {
            const pos = getMousePos(e);
            const w = pos.x - startX, h = pos.y - startY;
            selection.style.width = Math.abs(w) + 'px';
            selection.style.height = Math.abs(h) + 'px';
            selection.style.left = (w > 0 ? startX : pos.x) + 'px';
            selection.style.top = (h > 0 ? startY : pos.y) + 'px';
        }

        function autoScrollLoop() {
            if (!isDragging) { autoScrollTimer = null; return; }
            if (scrollYAmount !== 0 || scrollXAmount !== 0) {
                viewerPane.scrollTop += scrollYAmount;
                viewerPane.scrollLeft += scrollXAmount;
                if (lastMouseE) updateSelection(lastMouseE);
                autoScrollTimer = requestAnimationFrame(autoScrollLoop);
            } else {
                autoScrollTimer = null;
            }
        }

        container.onmousedown = (e) => { 
            if(!pdfDoc) return; 
            isDragging = true; 
            const pos = getMousePos(e); 
            startX = pos.x; startY = pos.y; 
            selection.style.left = startX + 'px'; selection.style.top = startY + 'px'; 
            selection.style.width = '0px'; selection.style.height = '0px'; 
            selection.style.display = 'block'; 
        };

        window.onmousemove = (e) => { 
            if(!isDragging) return; 
            lastMouseE = e;

            const rect = viewerPane.getBoundingClientRect();
            const margin = 80;
            const maxSpeed = 15; 

            scrollYAmount = 0;
            scrollXAmount = 0;

            if (e.clientY > rect.bottom - margin) {
                scrollYAmount = maxSpeed * Math.min(1, (e.clientY - (rect.bottom - margin)) / margin);
            } else if (e.clientY < rect.top + margin) {
                scrollYAmount = -maxSpeed * Math.min(1, ((rect.top + margin) - e.clientY) / margin);
            }

            if (e.clientX > rect.right - margin) {
                scrollXAmount = maxSpeed * Math.min(1, (e.clientX - (rect.right - margin)) / margin);
            } else if (e.clientX < rect.left + margin) {
                scrollXAmount = -maxSpeed * Math.min(1, ((rect.left + margin) - e.clientX) / margin);
            }

            if ((scrollYAmount !== 0 || scrollXAmount !== 0) && !autoScrollTimer) {
                autoScrollTimer = requestAnimationFrame(autoScrollLoop);
            }

            updateSelection(e);
        };
        
        window.onmouseup = () => {
            if(!isDragging) return; 
            isDragging = false;
            lastMouseE = null;
            scrollYAmount = 0; scrollXAmount = 0;
            if (autoScrollTimer) { cancelAnimationFrame(autoScrollTimer); autoScrollTimer = null; }

            const vW = parseFloat(canvas.style.width), vH = parseFloat(canvas.style.height);
            const rx = parseFloat(selection.style.left) / vW, ry = parseFloat(selection.style.top) / vH, rw = parseFloat(selection.style.width) / vW, rh = parseFloat(selection.style.height) / vH;
            if(rw < 0.005 || rh < 0.005) { selection.style.display = 'none'; return; }
            
            const num = document.getElementById('q-num').value;
            currentData[num] = { 
                p: pageNum, 
                rect: [rx, ry, rw, rh].map(v => parseFloat(v.toFixed(6))), 
                ans: document.getElementById('q-ans').value, 
                score: parseFloat(document.getElementById('q-score').value), 
                difficulty: parseInt(document.getElementById('q-difficulty').value),
                topic: document.getElementById('q-topic').value,
                type: document.getElementById('q-type').value,
                behavior: document.getElementById('q-behavior').value,
                magazineType: document.getElementById('q-magazine-type').value,
                tags: document.getElementById('q-tags').value.split(',').map(t => t.trim()).filter(t => t)
            };
            if(!editingNum) document.getElementById('q-num').value = parseInt(num) + 1;
            selection.style.display = 'none'; updateDataList(); renderCapturedLayers();
        };

        function updateDataList() {
            const list = document.getElementById('data-list'); list.innerHTML = '';
            const keys = Object.keys(currentData).sort((a,b)=>Number(a)-Number(b));
            document.getElementById('captured-count').innerText = keys.length;
            
            keys.forEach(n => {
                const d = currentData[n]; const isEditing = editingNum === n.toString();
                const item = document.createElement('div');
                item.className = `bg-white/5 border ${isEditing ? 'border-rose-500 bg-rose-500/10' : 'border-white/10'} p-3 rounded-xl flex justify-between items-center group hover:bg-white/10 transition-all mb-2 cursor-pointer shadow-sm`;
                
                item.innerHTML = `
                    <div class="flex flex-col text-left">
                        <span class="text-indigo-400 font-black text-sm">Question ${n}</span>
                        <span class="text-[9px] font-bold opacity-50 uppercase tracking-widest mt-0.5">P${d.p} · 정답 ${d.ans} · ${d.score}점 · 난이도${d.difficulty || 3}</span>
                        <span class="text-[9px] text-slate-400 truncate mt-1">${d.topic} / ${d.type || '유형미상'}</span>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editItem('${n}', event)" class="p-2 text-slate-400 hover:text-indigo-400"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="deleteData('${n}', event)" class="p-2 text-slate-400 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
                item.onclick = () => focusItem(n);
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        window.editItem = (n, e) => {
            if(e) e.stopPropagation();
            const d = currentData[n]; editingNum = n.toString();
            document.getElementById('q-num').value = n;
            document.getElementById('q-ans').value = d.ans || "3";
            document.getElementById('q-score').value = d.score || 2.0;
            document.getElementById('q-difficulty').value = d.difficulty || 3;
            document.getElementById('q-topic').value = d.topic || "미분류";
            document.getElementById('q-type').value = d.type || "합답형(ㄱ,ㄴ,ㄷ)";
            document.getElementById('q-behavior').value = d.behavior || "자료 변환 및 해석";
            document.getElementById('q-magazine-type').value = d.magazineType || "prac";
            document.getElementById('q-tags').value = (d.tags && Array.isArray(d.tags)) ? d.tags.join(', ') : "";
            
            document.getElementById('edit-form-container').classList.add('edit-mode-active');
            document.getElementById('edit-mode-indicator').classList.remove('hidden');
            document.getElementById('editing-q-num-text').innerText = n;
            focusItem(n); updateDataList();
        };

        window.focusItem = (n) => {
            const d = currentData[n]; if(!d) return;
            if(d.p !== pageNum) { pageNum = d.p; renderPage(); }
            setTimeout(() => { document.querySelectorAll('.captured-rect').forEach(l => { if(l.dataset.q === n.toString()) l.classList.add('active'); else l.classList.remove('active'); }); }, 200);
        };

        window.updateAndSaveSingle = async () => {
            const num = document.getElementById('q-num').value;
            if(!currentData[num]) return alert("먼저 좌표를 드래그하여 생성하세요!");
            
            currentData[num].ans = document.getElementById('q-ans').value;
            currentData[num].score = parseFloat(document.getElementById('q-score').value);
            currentData[num].difficulty = parseInt(document.getElementById('q-difficulty').value);
            currentData[num].topic = document.getElementById('q-topic').value;
            currentData[num].type = document.getElementById('q-type').value;
            currentData[num].behavior = document.getElementById('q-behavior').value;
            currentData[num].magazineType = document.getElementById('q-magazine-type').value;
            currentData[num].tags = document.getElementById('q-tags').value.split(',').map(t => t.trim()).filter(t => t);
            
            const examId = document.getElementById('target-exam-id').value.trim();
            if(!examId) return alert("Exam ID 입력!");
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'archive_coords', examId), { examId, coords: currentData, updatedAt: new Date().toISOString() });
                editingNum = null; document.getElementById('edit-form-container').classList.remove('edit-mode-active'); document.getElementById('edit-mode-indicator').classList.add('hidden');
                alert(`✅ Q${num} 문항 정보가 DB에 업데이트되었습니다!`); updateDataList();
            } catch (e) { alert("저장 실패: " + e.message); }
            finally { document.getElementById('loading-overlay').classList.add('hidden'); }
        };

        function renderCapturedLayers() {
            const layer = document.getElementById('captured-layers'); layer.innerHTML = '';
            const vW = parseFloat(canvas.style.width), vH = parseFloat(canvas.style.height);
            Object.keys(currentData).forEach(n => {
                const d = currentData[n]; if(d.p !== pageNum) return;
                const div = document.createElement('div'); div.className = 'captured-rect'; div.dataset.q = n;
                div.style.left = (d.rect[0] * vW) + 'px'; div.style.top = (d.rect[1] * vH) + 'px'; div.style.width = (d.rect[2] * vW) + 'px'; div.style.height = (d.rect[3] * vH) + 'px';
                div.innerHTML = `<span class="bg-emerald-500 text-[9px] font-black text-white px-1.5 py-0.5 absolute top-0 left-0 rounded-br-md">Q${n}</span>`;
                layer.appendChild(div);
            });
        }

        window.deleteData = (n, e) => { if(e) e.stopPropagation(); if(confirm(`문항 Q${n} 좌표 정보를 삭제하시겠습니까?`)) { delete currentData[n]; updateDataList(); renderCapturedLayers(); } };
        
        window.saveToDB = async () => { 
            const examId = document.getElementById('target-exam-id').value.trim();
            if(!examId) return alert("시험 ID를 입력하세요!");
            if(Object.keys(currentData).length === 0) return alert("저장할 데이터가 없습니다.");
            if(!confirm(`[${examId}]의 전체 데이터를 클라우드에 저장하시겠습니까?`)) return;
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'archive_coords', examId), { examId, coords: currentData, updatedAt: new Date().toISOString() });
                alert("🎉 전체 데이터 동기화 완료!");
            } catch (e) { alert("저장 실패: " + e.message); }
            finally { document.getElementById('loading-overlay').classList.add('hidden'); }
        };
        lucide.createIcons();
    </script>
</body>
</html>
