<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자책 뷰어 연결 중...</title>
</head>
<body style="background:#0f172a; margin:0; padding:0;">
    <script>
        // 상단 중복 메뉴 완전 제거: b2b_ebook_viewer.html로 즉시 안전 리다이렉트
        const params = new URLSearchParams(window.location.search);
        if (!params.has('preview')) params.set('preview', 'true');
        if (!params.has('w')) params.set('w', '1');
        window.location.replace('./b2b_ebook_viewer.html?' + params.toString());
    </script>
</body>
</html>
